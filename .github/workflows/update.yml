name: データ更新とサイト公開

on:
  schedule:
    - cron: "30 19 * * *"   # 毎日 04:30（日本時間）
  workflow_dispatch:         # 手動実行ボタン
  push:
    branches: [main]         # サイトを編集したときは公開だけ行う

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # データはリポジトリに保存せず、Actions のキャッシュで前回分を引き継ぐ
      - name: 前回のデータを復元
        uses: actions/cache/restore@v4
        with:
          path: public/data
          key: wos-data-${{ github.run_id }}
          restore-keys: wos-data-

      # 公式Wikiから英雄のID・日本語名・アイコンを集める（前回から7日以上たっていれば実行）
      - name: 英雄一覧を更新
        if: github.event_name != 'push'
        continue-on-error: true
        run: node scripts/build-hero-db.mjs

      - name: データ取得
        if: github.event_name != 'push'
        env:
          WOS_API_KEY: ${{ secrets.WOS_API_KEY }}
        run: node scripts/fetch-data.mjs

      - name: データを保存（キャッシュ）
        if: always() && github.event_name != 'push'
        uses: actions/cache/save@v4
        with:
          path: public/data
          key: wos-data-${{ github.run_id }}

      # SvS の履歴は取り直しがきかないので、キャッシュではなくリポジトリに保存する（小さいファイル）
      - name: SvS履歴・英雄一覧を保存（コミット）
        if: always() && github.event_name != 'push'
        run: |
          if [ -n "$(git status --porcelain history public/hero-db.json 2>/dev/null)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add history public/hero-db.json 2>/dev/null || true
            git add -A history 2>/dev/null || true
            [ -f public/hero-db.json ] && git add public/hero-db.json
            git commit -m "SvS履歴・英雄一覧を更新 $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi

      # 以前の版でリポジトリに入れたデータを、今後は管理対象から外す（初回のみ実行される）
      - name: リポジトリからデータを外す
        if: github.event_name != 'push'
        run: |
          if git ls-files public/data | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git rm -r -q --cached public/data
            grep -qx "public/data/" .gitignore 2>/dev/null || echo "public/data/" >> .gitignore
            git add .gitignore
            git commit -m "データをリポジトリの管理対象から外す（キャッシュ方式へ移行）"
            git pull --rebase origin main
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
