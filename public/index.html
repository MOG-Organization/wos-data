<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoS 王国データ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF0F5;
    --surface: #F7FAFC;
    --ink: #16273A;
    --steel: #586D82;
    --rime: #C9D5E1;
    --ember: #D47A22;
    --ember-soft: #F3D2AE;
    --link: #1F5E99;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1A26; --surface: #152536; --ink: #E2EBF3; --steel: #91A5B9;
      --rime: #263A50; --ember: #F09A46; --ember-soft: #5A3A1C; --link: #8CC2F2;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible, th:focus-visible {
    outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 3px;
  }
  .num { font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  header.site {
    border-bottom: 1px solid var(--rime); background: var(--surface);
  }
  header.site .in { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  header.site .brand { font-weight: 700; font-size: 17px; color: var(--ink); }
  header.site nav { display: flex; gap: 16px; font-size: 14px; }
  header.site .updated { margin-left: auto; font-size: 12px; color: var(--steel); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.35; }
  h2 { font-size: 17px; margin: 32px 0 10px; }
  .sub { color: var(--steel); font-size: 13px; margin: 0 0 18px; }

  .hero-num {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-weight: 700;
    font-size: clamp(64px, 14vw, 120px); line-height: .9; letter-spacing: -.01em;
    color: var(--ink); margin: 0;
  }
  .hero-num small { font-family: "Zen Kaku Gothic New", sans-serif; font-size: 18px; font-weight: 500; color: var(--steel); margin-right: 8px; letter-spacing: 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--rime); border-radius: 6px; overflow: hidden; margin: 18px 0 8px; }
  .stats div { padding: 10px 14px; box-shadow: 1px 0 0 var(--rime), 0 1px 0 var(--rime); }
  .stats dt { font-size: 12px; color: var(--steel); }
  .stats dd { margin: 0; font-size: 22px; font-weight: 700; }

  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  input[type=search] {
    font: inherit; padding: 8px 12px; border: 1px solid var(--rime); border-radius: 6px;
    background: var(--surface); color: var(--ink); width: min(280px, 100%);
  }
  .count { font-size: 13px; color: var(--steel); }
  button.more {
    font: inherit; font-size: 14px; padding: 8px 18px; border: 1px solid var(--rime); border-radius: 6px;
    background: var(--surface); color: var(--ink); cursor: pointer; margin-top: 12px;
  }

  .tablewrap { overflow-x: auto; border: 1px solid var(--rime); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--rime); }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; font-weight: 500; color: var(--steel); background: var(--bg); position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable[aria-sort=descending]::after { content: " ▼"; font-size: 9px; }
  th.sortable[aria-sort=ascending]::after { content: " ▲"; font-size: 9px; }
  td.r, th.r { text-align: right; }
  td .num { font-size: 16px; }
  tbody tr:hover { background: color-mix(in srgb, var(--ember-soft) 25%, transparent); }

  /* 戦力の「熱」バー：その表の最大値に対する割合 */
  .heat { display: grid; grid-template-columns: 1fr 5.2em; align-items: center; gap: 10px; min-width: 170px; }
  .heat i { display: block; height: 6px; border-radius: 3px; background: var(--rime); overflow: hidden; }
  .heat > span { text-align: right; }
  .heat i b { display: block; height: 100%; background: linear-gradient(90deg, var(--ember-soft), var(--ember)); }

  .rankpill { display: inline-block; min-width: 30px; text-align: center; font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rime); }
  .rankpill.r5 { border-color: var(--ember); color: var(--ember); font-weight: 700; }
  .rankpill.r4 { border-color: var(--steel); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
  .note { font-size: 13px; color: var(--steel); padding: 14px 16px; border: 1px dashed var(--rime); border-radius: 6px; background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .dim { color: var(--steel); font-size: 12px; }
  p.dim { margin: -4px 0 12px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .seg button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .seg button[aria-selected=true] { border-color: var(--ember); color: var(--ember); font-weight: 700; }
  td.win .num, td.win { color: var(--ember); font-weight: 700; }
  .chips .x { font: inherit; font-size: 13px; border: 0; background: none; color: var(--steel); cursor: pointer; margin-left: -6px; padding: 4px 6px; }
  .cmpgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .cmpcol { background: var(--surface); border: 1px solid var(--rime); border-radius: 6px; padding: 10px 12px; }
  .cmpcol h3 { margin: 0 0 6px; font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-size: 24px; }
  ol.top10 { list-style: none; margin: 0; padding: 0; }
  ol.top10 li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--rime); font-size: 14px; }
  ol.top10 li:last-child { border-bottom: 0; }
  ol.top10 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.top10 .sc { font-size: 16px; }
  ol.top10 .rk { color: var(--steel); }
  .res.win { color: var(--ember); font-weight: 700; }
  .res.lose { color: var(--steel); }
  .days { letter-spacing: .15em; font-weight: 700; white-space: nowrap; }
  .days .day.w { color: var(--ember); }
  .days .day.l { color: var(--steel); }
  .modeseg a { flex: 0 0 auto; padding: 6px 14px; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); font-size: 14px; color: var(--ink); text-decoration: none; }
  .modeseg a[aria-selected=true] { border-color: var(--ember); color: var(--ember); font-weight: 700; }
  .av, .hicon { position: relative; display: inline-grid; place-items: center; flex: 0 0 auto; overflow: hidden; background: var(--rime); color: var(--steel); font-weight: 700; }
  .av { width: 40px; height: 40px; border-radius: 50%; font-size: 16px; }
  .hicon { width: 30px; height: 30px; border-radius: 6px; font-size: 12px; }
  .av img, .hicon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .herogrid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .pcard { border-top: 1px solid var(--rime); padding: 10px 0; }
  .pcard:first-of-type { border-top: 0; }
  .phead { display: flex; gap: 10px; align-items: center; }
  .phead > div { min-width: 0; }
  .phead b { font-size: 14px; }
  .phead .dim { font-size: 11px; }
  .heroes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .hero { display: flex; gap: 5px; align-items: center; background: var(--bg); border-radius: 6px; padding: 5px 4px; min-width: 0; }
  .hmeta { display: flex; flex-direction: column; min-width: 0; font-size: 11px; line-height: 1.35; }
  .hmeta b { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hmeta span { color: var(--steel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hmeta .num { font-size: 12px; color: var(--ink); }
  details { margin-top: 6px; font-size: 12px; }
  details summary { cursor: pointer; color: var(--link); }
  .gd { padding: 6px 0; border-bottom: 1px dashed var(--rime); }
  .gd .dim { margin-left: 6px; }
  .gd .gicon { width: 22px; height: 22px; vertical-align: middle; margin-right: 6px; border-radius: 4px; }
  .gd .g { display: inline-block; margin: 3px 6px 0 0; padding: 1px 6px; border: 1px solid var(--rime); border-radius: 4px; }
  .gd .g.red { border-color: var(--ember); color: var(--ember); }
  .gd small { margin-left: 3px; color: var(--steel); }
  .picked { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 10px; }
  .kchip { display: inline-flex; align-items: center; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); }
  .kchip a { padding: 6px 4px 6px 14px; font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-size: 17px; }
  .kchip .x { font: inherit; border: 0; background: none; color: var(--steel); cursor: pointer; padding: 6px 12px 6px 8px; font-size: 16px; }
  .addk { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px dashed var(--ember); border-radius: 999px; background: none; color: var(--ember); cursor: pointer; }
  .picker { border: 1px solid var(--rime); border-radius: 8px; background: var(--surface); padding: 12px; margin: 0 0 14px; }
  .pkq { margin-bottom: 10px; }
  .pkrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pkb { font: inherit; display: inline-flex; gap: 6px; align-items: baseline; padding: 6px 12px; border: 1px solid var(--rime); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; }
  .pkb.on, .pkr.on { border-color: var(--ember); }
  .pkb b { font-size: 16px; }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--ember-soft); color: var(--ink); }
  .pkl { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
  .pkr { font: inherit; display: grid; grid-template-columns: 4.2em 1fr auto auto 1.6em; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--rime); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
  .pkr b { font-size: 16px; }
  .pkr .ck { color: var(--ember); font-weight: 700; text-align: center; }
  input.hn-in { font: inherit; font-size: 16px; padding: 4px 8px; border: 1px solid var(--rime); border-radius: 4px; background: var(--surface); color: var(--ink); width: 10em; }
  code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  .people { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
  .person { background: var(--surface); border: 1px solid var(--rime); border-radius: 8px; padding: 10px 12px; display: grid; gap: 6px; }
  .person b { font-size: 15px; margin-right: 6px; }
  .person label, .filters label { display: grid; grid-template-columns: 6.5em 1fr; align-items: center; gap: 8px; font-size: 13px; color: var(--steel); }
  .person input, .filters input[type=text] { font: inherit; font-size: 16px; padding: 5px 8px; border: 1px solid var(--rime); border-radius: 5px; background: var(--bg); color: var(--ink); min-width: 0; }
  .person input[readonly] { border-style: dashed; }
  .person input.pname { font-weight: 700; font-size: 15px; border-color: transparent; background: none; padding-left: 0; }
  .person input.pname:focus { border-color: var(--rime); background: var(--bg); }
  .filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px 20px; background: var(--surface); border: 1px solid var(--rime); border-radius: 8px; padding: 12px; margin-bottom: 8px; }
  .filters label { grid-template-columns: 1fr; gap: 4px; }
  .filters input[type=range] { width: 100%; accent-color: var(--ember); }
  .filters .rng { display: flex; gap: 6px; align-items: center; }
  .filters .rng input { width: 6em; }
  .star { font: inherit; font-size: 20px; line-height: 1; border: 0; background: none; color: var(--steel); cursor: pointer; padding: 2px 4px; }
  .star.on { color: var(--ember); }
  .candgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .cand { background: var(--surface); border: 1px solid var(--rime); border-radius: 8px; padding: 10px 12px; }
  .candhead { display: flex; justify-content: space-between; align-items: center; }
  .candhead a { font-size: 24px; font-weight: 700; }
  .candstats { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--steel); margin: 4px 0 8px; }
  .candstats b { color: var(--ink); }
  table.mini { font-size: 13px; margin-bottom: 8px; }
  table.mini th, table.mini td { padding: 5px 6px; }
  .tgbox { background: var(--surface); border: 1px solid var(--rime); border-radius: 8px; padding: 12px 14px; margin: 0 0 8px; display: grid; gap: 8px; font-size: 14px; }
  .tgbox.live { border-color: var(--ember); }
  .tggrp b { color: var(--ember); }
  .score { font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-weight: 700; font-size: 17px; }
  .score.hi { color: var(--ember); } .score.mid { color: var(--ink); } .score.lo { color: var(--steel); }
  .score.big { font-size: 26px; margin-left: auto; margin-right: 6px; } .score small { font-size: 12px; margin-left: 1px; }
  .st { margin-left: 6px; font-size: 10px; padding: 0 5px; border-radius: 3px; border: 1px solid var(--rime); white-space: nowrap; }
  .st-2 { border-color: var(--ember); color: var(--ember); } .st-4 { text-decoration: line-through; color: var(--steel); }
  .rankno { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--ember-soft); font-weight: 700; font-size: 13px; margin-right: 8px; }
  .candhead { gap: 0; }
  .evalbox { border: 1px solid var(--rime); border-radius: 6px; padding: 8px 10px; margin: 6px 0 10px; display: grid; gap: 4px; }
  .evst { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--steel); }
  .evst select { font: inherit; font-size: 16px; padding: 3px 6px; border: 1px solid var(--rime); border-radius: 5px; background: var(--bg); color: var(--ink); }
  .evrow { display: grid; grid-template-columns: 6.5em auto 1fr; gap: 8px; align-items: center; font-size: 13px; }
  .evl { color: var(--ink); }
  .pts { color: var(--ember); letter-spacing: 1px; font-size: 11px; } .pts .off { color: var(--rime); }
  .evw { font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stars button { font: inherit; font-size: 18px; line-height: 1; border: 0; background: none; color: var(--rime); cursor: pointer; padding: 0 1px; }
  .stars button.on { color: var(--ember); }
  .evcomment { font: inherit; font-size: 16px; padding: 5px 8px; border: 1px solid var(--rime); border-radius: 5px; background: var(--bg); color: var(--ink); margin-top: 4px; }
  .mshead { display: flex; align-items: center; gap: 10px; }
  .mshead h1 { font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-size: 40px; margin: 0; }
  .mshead .score.big { margin-left: auto; }
  b.ok { color: var(--ember); } b.ng { color: var(--steel); text-decoration: line-through; }
  .aldist { display: grid; gap: 6px; }
  .alrow { display: grid; grid-template-columns: minmax(8em, 14em) 1fr 3em; gap: 4px 10px; align-items: center; font-size: 13px; }
  .alrow .alx { grid-column: 1 / -1; font-size: 11px; margin-top: -4px; }
  .aln { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .albar { height: 8px; background: var(--rime); border-radius: 4px; overflow: hidden; } .albar i { display: block; height: 100%; background: var(--ember); }
  .bands { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .bands span { font-size: 11px; padding: 0 5px; border: 1px solid var(--rime); border-radius: 4px; white-space: nowrap; }
  .filters select { font: inherit; font-size: 16px; padding: 5px 8px; border: 1px solid var(--rime); border-radius: 5px; background: var(--bg); color: var(--ink); }
  .filters .check { font-size: 13px; color: var(--steel); }
  .evhead { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; }
  .evhead .cd { color: var(--ember); margin-left: auto; }
  .tag.rumor { background: var(--rime); }
  .evseg { margin: 0 0 4px; }
  .evseg button .tag { margin-left: 6px; }
  ol.phases { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  ol.phases li { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; padding: 6px 8px; border-radius: 6px; background: var(--bg); font-size: 13px; }
  ol.phases li.done { opacity: .55; }
  ol.phases li.cur { outline: 1px solid var(--ember); }
  ol.phases li span { color: var(--steel); }
  .passbox { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; background: var(--surface); border: 1px solid var(--ember); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .passbox label:first-child { display: flex; gap: 8px; align-items: center; font-size: 14px; }
  .passbox input[type=password] { font: inherit; font-size: 16px; padding: 6px 10px; border: 1px solid var(--rime); border-radius: 5px; background: var(--bg); color: var(--ink); width: 12em; }
  .linkbtn { font: inherit; font-size: 12px; border: 0; background: none; color: var(--link); cursor: pointer; padding: 0; text-decoration: underline; }
  .pinfo { font-size: 12px; color: var(--steel); line-height: 1.6; }
  .pheroes { display: flex; gap: 4px; align-items: center; }
  .pheroes .dim { margin-left: 4px; font-size: 11px; }
  .tggrp.warn { color: var(--ember); font-weight: 700; }
  .notes { margin: 0 0 8px; display: grid; gap: 6px; }
  .notebtn { display: inline-flex; gap: 4px; align-items: center; justify-self: start; padding: 6px 12px; border: 1px solid var(--ember); border-radius: 999px; font-size: 13px; color: var(--ember); text-decoration: none; }
  .notebtn:hover { text-decoration: none; background: var(--ember-soft); }
  .noteedit summary { font-size: 12px; color: var(--link); cursor: pointer; }
  .noteedit input { font: inherit; font-size: 16px; width: 100%; margin: 6px 0 2px; padding: 5px 8px; border: 1px solid var(--rime); border-radius: 5px; background: var(--bg); color: var(--ink); }
  .noteedit .dim { font-size: 11px; }
  .sharebar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin: -4px 0 12px; }
  label.check { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .jp { display: inline-block; min-width: 3.2em; text-align: right; }
  .jp.hi { color: var(--ember); font-weight: 700; }
  .chips a { padding: 4px 12px; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); font-size: 14px; }

  .tabbar { display: none; }
  header.site nav.topnav a[aria-current=page] { color: var(--ember); font-weight: 700; }
  input[type=search] { font-size: 16px; } /* iOS で入力時に拡大されないように */
  @media (max-width: 640px) {
    body { font-size: 14px; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    header.site .in { padding: 10px 14px; gap: 10px; flex-wrap: nowrap; }
    header.site .brand { font-size: 16px; white-space: nowrap; }
    header.site nav.topnav { display: none; }
    .tools.addrow { flex-wrap: nowrap; }
    .tools.addrow input[type=search] { min-width: 0; }
    .tools.addrow button { flex: 0 0 auto; }
    header.site .updated { font-size: 11px; }
    main { padding: 16px 14px 32px; }
    h1 { font-size: 19px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .hs { display: none; }
    th, td { padding: 7px 8px; }
    td .num { font-size: 15px; }
    .heat { min-width: 0; grid-template-columns: 1fr; }
    .heat i { display: none; }
    .heat > span { text-align: right; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stats dd { font-size: 19px; }
    .chips.scrollx, .seg { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .chips.scrollx a, .seg button { flex: 0 0 auto; white-space: nowrap; }

<body>

</nav>
<footer>
  データ出典: Whiteout Stats API（最大1時間前のデータを毎日取得）。Whiteout Survival は Century Games Pte. Ltd. の商標です。本サイトはファン制作で、同社とは関係ありません。
</footer>

<script>
// "main"＝通常のサイト。"migrate"＝移民検討専用ページ（デプロイ時に migrate.html として自動生成）
const MODE = "main";
const app = document.getElementById("app");
const cache = new Map();

async function load(rel) {
  if (cache.has(rel)) return cache.get(rel);
  const p = fetch("data/" + rel, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  cache.set(rel, p);
  return p;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeTag = tag => encodeURIComponent(tag).replace(/%/g, "_");

// 数値を「億・万」で表示
function jp(n) {
  if (n == null || n === "" || isNaN(n)) return "–";
  n = Number(n);
  const a = Math.abs(n);
  if (a >= 1e8) return Number((n / 1e8).toFixed(a >= 1e10 ? 0 : 2)).toLocaleString("ja-JP") + "億";
  if (a >= 1e4) return Number((n / 1e4).toFixed(a >= 1e6 ? 0 : 1)).toLocaleString("ja-JP") + "万";
  return n.toLocaleString("ja-JP");
}
const int = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("ja-JP");
function ago(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function heat(v, max) {
  const pct = max > 0 && v > 0 ? Math.max(2, Math.round(v / max * 100)) : 0;
  return `<span class="heat"><i><b style="width:${pct}%"></b></i><span class="num">${jp(v)}</span></span>`;
}
const JP_TH = 30;
// 総戦力：power が 0 / 未集計のときは領主戦力の合計（gov_power）を使う
const totalPower = s => Number(s?.power) || Number(s?.gov_power) || null;
// 地底探検（The Labyrinth）。エリア名はアルテマの地底探検ページの表記
const LABY = [
  ["labyrinth", "総合"], ["land_of_heroes", "英雄の地"], ["cave_of_monsters", "獣の洞窟"], ["charm_mine", "宝石鉱山"],
  ["research_center", "地下科学研究所"], ["gear_forge", "装備の鍛冶炉"], ["gaia_heart", "大地の心"],
];
function jpBadge(v) {
  if (v == null) return "–";
  return `<span class="num jp ${v >= JP_TH ? "hi" : ""}">${v}%</span>`;
}
function rankPill(label, rank) {
  const t = label || (rank ? "R" + rank : "");
  const cls = /5/.test(t) ? "r5" : /4/.test(t) ? "r4" : "";
  return t ? `<span class="rankpill ${cls}">${esc(t)}</span>` : "";
}
function firstArray(obj, keys) {
  if (Array.isArray(obj)) return obj;
  if (!obj || typeof obj !== "object") return [];
  for (const k of keys) if (Array.isArray(obj[k])) return obj[k];
  return [];
}
function boardRows(boards, key) {
  if (!boards) return [];
  if (Array.isArray(boards)) {
    const b = boards.find(x => [x.board, x.key, x.type, x.slug].includes(key));
    return b ? firstArray(b, ["rows", "entries", "items", "ranks"]) : [];
  }
  return firstArray(boards[key], ["rows", "entries", "items", "ranks"]);
}

// 並べ替えできる表
function sortableTable({ columns, rows, initialSort, pageSize = 100, filter }) {
  let sortKey = initialSort.key, dir = initialSort.dir, shown = pageSize;
  const wrap = document.createElement("div");
  const render = () => {
    let list = filter ? rows.filter(filter()) : rows.slice();
    const col = columns.find(c => c.key === sortKey);
    const val = col?.sortVal || (r => r[sortKey]);
    list.sort((a, b) => {
      const x = val(a), y = val(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y, "ja") : x - y) * (dir === "asc" ? 1 : -1);
    });
    const max = {};
    columns.filter(c => c.heat).forEach(c => max[c.key] = Math.max(0, ...list.map(r => Number(r[c.key]) || 0)));
    const head = columns.map(c => `<th class="${c.r ? "r " : ""}${c.hs ? "hs " : ""}${c.sort !== false ? "sortable" : ""}" ${c.sort !== false ? `tabindex="0" data-k="${c.key}"` : ""} ${c.key === sortKey ? `aria-sort="${dir === "asc" ? "ascending" : "descending"}"` : ""}>${c.label}</th>`).join("");
    const body = list.slice(0, shown).map((r, i) => `<tr>${columns.map(c => `<td class="${c.r ? "r" : ""}${c.hs ? " hs" : ""}">${c.cell(r, i, max[c.key])}</td>`).join("")}</tr>`).join("");
    wrap.innerHTML = `<p class="count">${int(list.length)}件</p><div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${columns.length}">該当なし</td></tr>`}</tbody></table></div>${list.length > shown ? `<button class="more">さらに${Math.min(pageSize, list.length - shown)}件表示</button>` : ""}`;
    wrap.querySelectorAll("th.sortable").forEach(th => {
      const go = () => { const k = th.dataset.k; dir = (k === sortKey && dir === "desc") ? "asc" : "desc"; sortKey = k; render(); };
      th.onclick = go; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    });
    const more = wrap.querySelector("button.more");
    if (more) more.onclick = () => { shown += pageSize; render(); };
  };
  wrap.rerender = () => { shown = pageSize; render(); };
  render();
  return wrap;
}

// ---------- 王国一覧 ----------
async function viewStates() {
  const [data, idx, lang] = await Promise.all([load("states.json"), load("alliances/index.json"), load("lang.json")]);
  const L = lang?.states || {};
  data.states.forEach(s => { const x = L[s.kid]; s.jp = x ? x.jp : null; s._power = totalPower(s); });
  if (!data) {
    app.innerHTML = `<h1>王国一覧</h1><p class="note">まだデータがありません。GitHub の Actions タブで「データ更新とサイト公開」を手動実行すると、初回のデータが入ります。</p>`;
    return;
  }
  const watched = (idx?.alliances || []);
  app.innerHTML = `
    <h1>王国一覧</h1>
    <p class="sub">全${int(data.states.length)}王国。見出しを押すと並べ替えできます。</p>
    ${watched.length ? `<h2>同盟ページがある同盟</h2><div class="chips scrollx">${watched.map(a => `<a href="#/alliance/${a.kid}/${encodeURIComponent(a.tag)}">[${esc(a.tag)}] ${esc(a.name)}<span class="dim"> #${a.kid}</span></a>`).join("")}</div>` : ""}
    <h2>すべての王国</h2><div class="tools"><input type="search" id="q" name="kingdom_search" placeholder="王国を検索（例：3345）" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="王国を検索">
      <label class="check"><input type="checkbox" id="jponly"> 日本人が多い王国だけ（日本語名 ${JP_TH}%以上）</label></div>
    <p class="dim">日本語名＝戦力上位100人のうち、名前にひらがな・カタカナを含む人の割合。ローマ字名は数えないため目安です。未取得の王国は「–」で、順次埋まります。</p>
    <div id="list"></div>`;
  const q = app.querySelector("#q"), jpOnly = app.querySelector("#jponly");
  const table = sortableTable({
    rows: data.states,
    initialSort: { key: "_power", dir: "desc" },
    filter: () => { const v = q.value.trim(), j = jpOnly.checked; return r => (!v || String(r.kid).startsWith(v)) && (!j || (r.jp ?? -1) >= JP_TH); },
    columns: [
      { key: "kid", label: "王国", cell: r => `<a href="#/state/${r.kid}"><span class="num">#${r.kid}</span></a>` },
      { key: "_power", label: "総戦力", r: false, heat: true, cell: (r, i, m) => heat(r._power, m) },
      { key: "avg_power", label: "平均戦力", r: true, hs: true, cell: r => `<span class="num">${jp(r.avg_power)}</span>` },
      { key: "player_count", label: "人数", r: true, cell: r => `<span class="num">${int(r.player_count)}</span>` },
      { key: "alliance_count", label: "同盟数", r: true, hs: true, cell: r => `<span class="num">${int(r.alliance_count)}</span>` },
      { key: "power_gain_7d", label: "7日の戦力増", r: true, hs: true, cell: r => `<span class="num">${jp(r.power_gain_7d)}</span>` },
      { key: "jp", label: "日本語", r: true, cell: r => jpBadge(r.jp) },
      { key: "age_days", label: "開設から", r: true, hs: true, cell: r => r.age_days != null ? `<span class="num">${int(r.age_days)}</span>日` : "–" },
    ],
  });
  q.oninput = () => table.rerender();
  jpOnly.onchange = () => table.rerender();
  q.onkeydown = e => { if (e.key === "Enter" && /^\d+$/.test(q.value.trim())) location.hash = `#/state/${q.value.trim()}`; };
  app.querySelector("#list").append(table);
}

// ---------- 王国ページ ----------
async function viewState(kid) {
  const [detail, list, idx, lang, svs] = await Promise.all([load(`states/${kid}.json`), load("states.json"), load("alliances/index.json"), load("lang.json"), load(`svs/${kid}.json`)]);
  const jpStat = lang?.states?.[kid];
  const s = detail?.state || list?.states?.find(x => String(x.kid) === String(kid));
  if (!s) { app.innerHTML = `<p class="note">王国 #${esc(kid)} のデータはまだありません。王国番号を確認するか、次回の更新をお待ちください。<br><a href="#/">王国一覧に戻る</a></p>`; return; }
  const have = new Set((idx?.alliances || []).filter(a => String(a.kid) === String(kid)).map(a => a.tag));
  const stat = (label, v) => `<div><dt>${label}</dt><dd class="num">${v}</dd></div>`;
  app.innerHTML = `
    <p class="hero-num"><small>王国</small>${esc(kid)}</p>
    <p class="sub"><a href="#/compare/${esc(kid)}">この王国を地底探検比較に入れる →</a></p>
    <p class="sub">${s.opened_on ? `開設 ${esc(s.opened_on)}` : ""}${s.age_days != null ? `（${int(s.age_days)}日目）` : ""}　${detail ? `更新 ${ago(detail.updated_at)}` : "詳細は順次取得中です"}</p>
    <dl class="stats">
      ${stat("総戦力", jp(totalPower(s)))}${stat("平均戦力", Number(s.avg_power) ? jp(s.avg_power) : "–")}${stat("戦力順位", s.power_rank ? int(s.power_rank) + "位" : "–")}
      ${stat("人数", int(s.player_count))}${stat("同盟数", int(s.alliance_count))}${stat("7日の戦力増", Number(s.power_gain_7d) ? jp(s.power_gain_7d) : "–")}
      ${stat("地底探検（合計）", s.labyrinth ? int(s.labyrinth) : "–")}
      ${stat("日本語名（上位" + (jpStat?.n ?? 100) + "人）", jpStat ? jpStat.jp + "%" : "–")}
    </dl>
    <section id="svs"></section>
    <div class="grid2"><section id="al"></section><section id="pl"></section></div>
    <section id="lab"></section>`;
  renderSvs(app.querySelector("#svs"), svs);
  if (!detail) return;
  const alliances = boardRows(detail.boards, "alliance_power");
  const players = boardRows(detail.boards, "personal_power");
  const al = app.querySelector("#al"), pl = app.querySelector("#pl");
  al.innerHTML = `<h2>同盟戦力ランキング</h2>`;
  al.append(alliances.length ? sortableTable({
    rows: alliances.map((r, i) => ({ ...r, _rank: i + 1 })), initialSort: { key: "_rank", dir: "asc" }, pageSize: 20,
    columns: [
      { key: "_rank", label: "順位", cell: r => `<span class="num">${r._rank}</span>` },
      { key: "abbr", label: "同盟", cell: r => have.has(r.abbr) ? `<a href="#/alliance/${kid}/${encodeURIComponent(r.abbr)}">[${esc(r.abbr)}] ${esc(r.name)}</a>` : `[${esc(r.abbr)}] ${esc(r.name)}` },
      { key: "score", label: "戦力", heat: true, cell: (r, i, m) => heat(r.score, m) },
    ],
  }) : Object.assign(document.createElement("p"), { className: "note", textContent: "ランキングデータがありません。" }));
  pl.innerHTML = `<h2>個人戦力ランキング</h2>`;
  pl.append(players.length ? sortableTable({
    rows: players.map((r, i) => ({ ...r, _rank: i + 1 })), initialSort: { key: "_rank", dir: "asc" }, pageSize: 20,
    columns: [
      { key: "_rank", label: "順位", cell: r => `<span class="num">${r._rank}</span>` },
      { key: "nick_name", label: "領主", cell: r => esc(r.nick_name) },
      { key: "score", label: "戦力", heat: true, cell: (r, i, m) => heat(r.score, m) },
    ],
  }) : Object.assign(document.createElement("p"), { className: "note", textContent: "ランキングデータがありません。" }));
  renderLabyrinth(app.querySelector("#lab"), detail.boards);
}

// SvS 履歴（準備期間の点数）
function svsResult(e) {
  if (e.bye) return { text: "対戦なし", cls: "" };
  if (!e.final) return { text: "進行中", cls: "dim" };
  if (e.score > e.opponent_score) return { text: "勝ち", cls: "win" };
  if (e.score < e.opponent_score) return { text: "負け", cls: "lose" };
  return { text: "引き分け", cls: "" };
}
function svsDays(e) {
  return (e.days || []).map(d => {
    const done = /ended/i.test(d.status || "");
    const mark = !done ? "・" : d.own > d.opp ? "○" : d.own < d.opp ? "×" : "△";
    return `<span class="day ${done ? (d.own > d.opp ? "w" : "l") : ""}" title="${d.day}日目 ${esc(d.status)}：${int(d.own)} 対 ${int(d.opp)}">${mark}</span>`;
  }).join("");
}
function renderSvs(el, list) {
  if (!list?.length) {
    el.innerHTML = `<h2>SvS履歴（準備期間）</h2><p class="note">SvSの記録はまだありません。Frostyキーで運用している場合、SvS期間中に自動で記録されます。</p>`;
    return;
  }
  const fin = list.filter(e => e.final && !e.bye);
  const w = fin.filter(e => e.score > e.opponent_score).length;
  el.innerHTML = `<h2>SvS履歴（準備期間）</h2>
    <p class="sub">記録 ${list.length}シーズン　確定分 ${w}勝 ${fin.length - w}敗。準備期間（1〜5日目）の点数での勝敗で、城の攻防戦の結果ではありません。</p>`;
  el.append(sortableTable({
    rows: list, initialSort: { key: "season", dir: "desc" }, pageSize: 10,
    columns: [
      { key: "season", label: "シーズン", cell: r => `<span class="num">S${r.season}</span>` },
      { key: "opponent", label: "対戦相手", cell: r => r.opponent ? `<a href="#/${MODE === "migrate" ? "s" : "state"}/${r.opponent}"><span class="num">#${r.opponent}</span></a>` : "–" },
      { key: "score", label: "自王国", r: true, cell: r => `<span class="num">${jp(r.score)}</span>` },
      { key: "opponent_score", label: "相手", r: true, cell: r => `<span class="num">${jp(r.opponent_score)}</span>` },
      { key: "_res", label: "結果", sort: false, cell: r => { const x = svsResult(r); return `<span class="res ${x.cls}">${x.text}</span>`; } },
      { key: "_days", label: "日別", sort: false, cell: r => `<span class="days">${svsDays(r)}</span>` },
    ],
  }));
}

// 地底探検ランキング（総合と6エリアを切り替え）
function renderLabyrinth(el, boards) {
  const tabs = LABY.filter(([k]) => boardRows(boards, k).length);
  if (!tabs.length) return;
  let cur = tabs[0][0];
  const draw = () => {
    const rows = boardRows(boards, cur).map((r, i) => ({ ...r, _rank: r.rank ?? i + 1 }));
    el.innerHTML = `<h2>地底探検ランキング</h2>
      <div class="seg" role="tablist">${tabs.map(([k, n]) => `<button role="tab" aria-selected="${k === cur}" data-k="${k}">${n}</button>`).join("")}</div>`;
    el.append(sortableTable({
      rows, initialSort: { key: "_rank", dir: "asc" }, pageSize: 20,
      columns: [
        { key: "_rank", label: "順位", cell: r => `<span class="num">${r._rank}</span>` },
        { key: "nick_name", label: "領主", cell: r => esc(r.nick_name) },
        { key: "alliance_abbr", label: "同盟", cell: r => r.alliance_abbr ? `[${esc(r.alliance_abbr)}]` : "–" },
        cur === "labyrinth"
          ? { key: "score", label: "スコア", r: true, cell: r => `<span class="num">${int(r.score)}</span>` }
          : { key: "score", label: "到達ステージ", r: true, cell: r => `<span class="num">${esc(r.score_label ?? r.score)}</span>` },
      ],
    }));
    el.querySelectorAll(".seg button").forEach(b => b.onclick = () => { cur = b.dataset.k; draw(); });
  };
  draw();
}

// ---------- 同盟ページ ----------
async function viewAlliance(kid, tag) {
  const [d, sd, svs] = await Promise.all([load(`alliances/${kid}/${safeTag(tag)}.json`), load(`states/${kid}.json`), load(`svs/${kid}.json`)]);
  const lastSvs = (svs || []).find(e => !e.bye);
  const labRows = boardRows(sd?.boards, "labyrinth");
  const lab = new Map(labRows.map((r, i) => [String(r.uid), { score: r.score, rank: r.rank ?? i + 1 }]));
  if (!d) { app.innerHTML = `<p class="note">同盟 [${esc(tag)}]（王国 #${esc(kid)}）のデータはまだありません。config.json の watch_alliances に追加すると、次回の更新から表示されます。<br><a href="#/state/${esc(kid)}">王国 #${esc(kid)} に戻る</a></p>`; return; }
  const a = d.alliance || {};
  const m = (d.members || []).map(x => { const L = lab.get(String(x.uid)); return { ...x, _lab: L ? L.score : null, _labRank: L ? L.rank : null }; });
  const furnaceMax = Math.max(0, ...m.map(x => Number(x.furnace_level) || 0));
  const stat = (label, v) => `<div><dt>${label}</dt><dd class="num">${v}</dd></div>`;
  app.innerHTML = `
    <p class="sub"><a href="#/state/${esc(kid)}">王国 #${esc(kid)}</a></p>
    <h1>[${esc(a.abbr || tag)}] ${esc(a.name || "")}</h1>
    <p class="sub">盟主 ${esc(a.leader_name || "–")}　更新 ${ago(d.updated_at)}</p>
    <dl class="stats">
      ${stat("同盟戦力", jp(a.power))}${stat("王国内順位", a.power_rank ? int(a.power_rank) + "位" : "–")}
      ${stat("メンバー", int(a.count ?? m.length))}${stat("最高溶鉱炉Lv", furnaceMax || "–")}
    </dl>

const MAX_COMPARE = 6;
const SEARCH_ATTRS = 'autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"';
// エリアのスコアは「基準値 + (ステージ-1)×10 + 小ステージ」の形（例：10495 = 50-5）。
// 実データの score と score_label の対応から割り出した式で、平均値をステージ表記に戻すのに使う
function stageLabel(score) {
  if (!score) return "–";
  const n = Math.round(score) % 10000;
  if (n <= 0) return "–";
  const stage = Math.ceil(n / 10);
  return `${stage}-${n - (stage - 1) * 10}`;
}
// 王国を選ぶパネル（開閉状態と検索語は画面を描き直しても保つ）
const PICK = { open: false, q: "", jp: false };
async function setupPicker(kids, setKids, mode) {
  const openBtn = app.querySelector("#openPick"), panel = app.querySelector("#picker");
  if (!panel) return;
  if (openBtn) openBtn.onclick = () => { PICK.open = !PICK.open; panel.hidden = !PICK.open; openBtn.setAttribute("aria-expanded", PICK.open); if (PICK.open) app.querySelector("#pkSearch").focus(); };
  const [list, meta, lang] = await Promise.all([load("states.json"), load("meta.json"), load("lang.json")]);
  const heroSet = new Set((meta?.hero_states || []).map(String));
  const L = lang?.states || {};
  const toggle = k => { k = String(k); if (kids.includes(k)) setKids(kids.filter(x => x !== k)); else if (kids.length < MAX_COMPARE) setKids([...kids, k]); };
  const btn = (k, label) => `<button type="button" class="pkb${kids.includes(String(k)) ? " on" : ""}" data-k="${k}">${label ? `<span class="dim">${label}</span>` : ""}<b class="num">#${k}</b>${heroSet.has(String(k)) ? `<span class="tag">英雄</span>` : ""}</button>`;

  // よく使う王国：自王国・SvSの対戦相手・英雄データがある王国
  const quick = [], used = new Set();
  const addQ = (k, label) => { if (!k || used.has(String(k))) return; used.add(String(k)); quick.push(btn(k, label)); };
  for (const k of meta?.watch_states || []) {
    addQ(k, "自王国");
    const last = (await load(`svs/${k}.json`) || []).find(e => e.opponent);
    if (last) addQ(last.opponent, `S${last.season} 相手`);
  }
  for (const k of meta?.hero_states || []) addQ(k, "");
  app.querySelector("#pkQuick").innerHTML = quick.length ? `<div class="dim">よく使う王国</div><div class="pkrow">${quick.join("")}</div>` : "";

  const listEl = app.querySelector("#pkList"), q = app.querySelector("#pkSearch"), jpBox = app.querySelector("#pkJp");
  const drawList = () => {
    PICK.q = q.value.trim(); PICK.jp = jpBox.checked;
    let rows = (list?.states || []).map(s => ({ ...s, jp: L[s.kid]?.jp ?? null }));
    if (PICK.q) rows = rows.filter(s => String(s.kid).startsWith(PICK.q));
    if (PICK.jp) rows = rows.filter(s => (s.jp ?? -1) >= JP_TH);
    if (!PICK.q && !PICK.jp) { listEl.innerHTML = `<p class="dim">王国番号を入力するか「日本人が多い王国」を選ぶと候補が出ます。</p>`; return; }
    rows.sort((a, b) => PICK.q ? a.kid - b.kid : (totalPower(b) || 0) - (totalPower(a) || 0));
    listEl.innerHTML = rows.length ? rows.slice(0, 30).map(s => `<button type="button" class="pkr${kids.includes(String(s.kid)) ? " on" : ""}" data-k="${s.kid}">
        <b class="num">#${s.kid}</b><span class="num">${jp(totalPower(s))}</span><span class="dim">${s.jp != null ? `日本語${s.jp}%` : ""}</span>${heroSet.has(String(s.kid)) ? `<span class="tag">英雄</span>` : "<span></span>"}<span class="ck">${kids.includes(String(s.kid)) ? "✓" : "＋"}</span></button>`).join("")
      + (rows.length > 30 ? `<p class="dim">ほか${rows.length - 30}件。番号を続けて入力すると絞り込めます。</p>` : "")
      : `<p class="dim">該当する王国がありません。</p>`;
    listEl.querySelectorAll(".pkr").forEach(b => b.onclick = () => toggle(b.dataset.k));
  };
  q.oninput = drawList; jpBox.onchange = drawList;
  q.onkeydown = e => { if (e.key === "Enter" && /^\d+$/.test(q.value.trim())) { e.preventDefault(); toggle(q.value.trim()); } };
  app.querySelectorAll("#pkQuick .pkb").forEach(b => b.onclick = () => toggle(b.dataset.k));
  drawList();
}

  app.innerHTML = `
    <h1>王国比較</h1>
    <div class="seg modeseg" role="tablist">
      <a role="tab" href="${modeLink("lab")}" aria-selected="${mode === "lab"}">地底探検</a>

      ${kids.length < MAX_COMPARE ? `<button type="button" class="addk" id="openPick" aria-expanded="${PICK.open}">＋ 王国を追加</button>` : `<span class="dim">上限の${MAX_COMPARE}王国です</span>`}</div>
    <div class="picker" id="picker" ${PICK.open && kids.length < MAX_COMPARE ? "" : "hidden"}>

        <label class="check"><input type="checkbox" id="pkJp" ${PICK.jp ? "checked" : ""}> 日本人が多い王国</label></div>

  if (mode === "hero") { await heroNamesReady; renderHeroCompare(box, kids, heroData); return; }

  const draw = () => {
    const isTotal = area === "labyrinth";
    const fmt = r => isTotal ? int(r.score) : esc(r.score_label ?? stageLabel(r.score));
    const cols = kids.map((k, i) => {
      const d = details[i];

      const scores = rows.map(r => Number(r.score) || 0);

      return { k, d, rows, top: scores[0] || 0, tenth: scores.length >= 10 ? scores[9] : 0, avg, total: d?.state?.labyrinth,

          <td class="r${mark(c.avg, "avg")}"><span class="num">${isTotal ? show(c.avg) : "≈ " + show(c.avg)}</span></td>
          ${isTotal ? `<td class="r${mark(c.total, "total")}"><span class="num">${c.total ? int(c.total) : "–"}</span></td>` : ""}
          <td class="dim hs">${c.d ? ago(c.d.updated_at) : "未取得"}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="dim" style="margin-top:6px">10位＝上位10人に入るためのライン。オレンジ色はその項目で一番高い王国です。${isTotal ? "" : "エリアの平均はスコアから換算した目安のステージです。"}</p>
      <h2>上位10人</h2>
      <div class="cmpgrid">${cols.map(c => `<section class="cmpcol">
        <h3><a href="#/state/${c.k}">#${c.k}</a></h3>
        ${!c.d ? `<p class="note">この王国の詳細はまだ取得されていません。順次取得されます。</p>`
          : !c.rows.length ? `<p class="note">ランキングデータがありません。</p>`
          : `<ol class="top10">${c.rows.map((r, i) => `<li><span class="rk num">${r.rank ?? i + 1}</span><span class="nm">${esc(r.nick_name)}${r.alliance_abbr ? ` <span class="dim">[${esc(r.alliance_abbr)}]</span>` : ""}</span><span class="sc num">${fmt(r)}</span></li>`).join("")}</ol>`}
      </section>`).join("")}</div>`;
    box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { area = b.dataset.k; draw(); });
  };
  draw();
}

// ---------- 英雄（防衛編成）の比較 ----------
const ADMIN_NAME = "くに"; // 英雄データの追加をお願いする相手（サイトの管理人）
const TROOP_JA = { Infantry: "盾兵", Lancer: "槍兵", Marksman: "弓兵" };
// 英雄名：hero-names.json（IDごとの日本語名・英語名ごとの日本語名）で置き換える
let HERO_NAMES = { by_id: {}, by_en: {}, icons: {}, icon_base: "" };
// hero-db.json（公式Wikiから自動作成）を土台に、hero-names.json（手で付けた名前）で上書きする
const getJSON = u => fetch(u, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
const heroNamesReady = Promise.all([getJSON("hero-db.json"), getJSON("hero-names.json")]).then(([db, man]) => {
  const by_id = {}, icons = {};
  for (const [id, h] of Object.entries(db?.heroes || {})) {
    if (h.ja || h.en) by_id[id] = h.ja || h.en;
    icons[id] = { hero: h.icons?.hero || null, gear: h.icons?.gear || null };
  }
  for (const [id, n] of Object.entries(man?.by_id || {})) if (n) by_id[id] = n;
  for (const [id, ic] of Object.entries(man?.icons || {})) icons[id] = { ...icons[id], ...Object.fromEntries(Object.entries(ic).filter(([, v]) => v)) };
  HERO_NAMES = { by_id, by_en: man?.by_en || {}, icons, icon_base: man?.icon_base || db?.icon_base || "" };
});
// アイコン：APIが返せばそれを使い、無ければ hero-names.json の公式Wiki画像を使う
const iconUrl = p => !p ? null : /^https?:/.test(p) ? p : HERO_NAMES.icon_base + p;
const heroIcon = h => h.icon || iconUrl(HERO_NAMES.icons[String(h.id)]?.hero);
const gearIcon = h => iconUrl(HERO_NAMES.icons[String(h.id)]?.gear);
const isPlaceholderName = n => !n || /^hero\s*\d+$/i.test(String(n).trim());
function heroName(h) {
  const byId = HERO_NAMES.by_id[String(h.id)];
  if (byId) return byId;
  if (!isPlaceholderName(h.name)) return HERO_NAMES.by_en[h.name] || h.name;
  return `英雄${h.id ?? "?"}`;
}
// 英雄装備の部位（APIは英語で返すので和名にする）
const SLOT_JA = { helmet: "兜", hat: "兜", gloves: "手袋", glove: "手袋", armor: "鎧", armour: "鎧", chest: "鎧", boots: "靴", boot: "靴", shoes: "靴" };
const slotJa = g => { const k = String(g.slot ?? g.name ?? "").trim().toLowerCase(); return SLOT_JA[k] || g.slot || g.name || "装備"; };
const teamPower = p => (p.heroes || []).reduce((a, h) => a + (Number(h.power) || 0), 0);
// 装備の強化値・錬成・赤装備の数（英雄戦力が空のときの比較材料）
function gearStats(players) {
  const gs = players.flatMap(p => (p.heroes || []).flatMap(h => h.gear || []));
  const avg = a => a.length ? a.reduce((x, y) => x + y, 0) / a.length : 0;
  return {
    enh: avg(gs.map(g => Number(g.enhancement_level) || 0)),
    ref: avg(gs.map(g => Number(g.refine_level) || 0)),
    red: players.length ? gs.filter(g => g.red).length / players.length : 0,
  };
}
const troopOf = h => h.gear?.find(g => g.troop_label)?.troop_label;
const isPlaceholderGear = n => !n || /^exclusive\s*\d+$/i.test(String(n).trim());
function avatar(url, name, cls = "av") {
  const ch = esc(String(name || "?").trim().charAt(0) || "?");
  return `<span class="${cls}">${ch}${url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;
}
function heroChip(h) {
  const troop = troopOf(h);
  return `<div class="hero">
    ${avatar(heroIcon(h), heroName(h), "hicon")}
    <div class="hmeta"><b title="ID ${esc(h.id)}">${esc(heroName(h))}</b>
      <span>Lv${esc(h.level ?? "–")}${h.stars != null ? ` ★${esc(h.stars)}` : ""}${troop ? ` ${esc((TROOP_JA[troop] || troop).charAt(0))}` : ""}</span>
      <span>${Number(h.power) ? `<span class="num">${jp(h.power)}</span> ` : ""}${h.exclusive_gear_level ? `専用Lv${esc(h.exclusive_gear_level)}` : "専用なし"}</span></div>
  </div>`;
}
function gearDetail(h) {
  const gear = (h.gear || []).map(g => `<span class="g${g.red ? " red" : ""}">${esc(slotJa(g))} +${esc(g.enhancement_level ?? 0)}${g.refine_level ? `<small>錬成${esc(g.refine_level)}</small>` : ""}</span>`).join("");
  const gi = gearIcon(h);
  return `<div class="gd">${gi ? `<img class="gicon" src="${esc(gi)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}<b>${esc(heroName(h))}</b>${h.exclusive_gear ? `<span class="dim">専用装備${isPlaceholderGear(h.exclusive_gear.name) ? "" : " " + esc(h.exclusive_gear.name)} Lv${esc(h.exclusive_gear.level ?? "")}</span>` : ""}<div>${gear || `<span class="dim">装備情報なし</span>`}</div></div>`;
}
function renderHeroCompare(box, kids, data) {
  const cols = kids.map((k, i) => {
    const d = data[i];
    const players = (d?.players || []).slice().sort((a, b) => (a.labyrinth_rank ?? 999) - (b.labyrinth_rank ?? 999));
    const tp = players.map(teamPower).filter(Boolean);

    return { k, d, players, avg: tp.length ? tp.reduce((a, b) => a + b, 0) / tp.length : 0,
      ex: exs.length ? exs.reduce((a, b) => a + b, 0) / exs.length : 0, enh: g.enh, ref: g.ref, red: g.red };
  });

        ${hasPower ? `<td class="r${mark(c.avg, "avg")}"><span class="num">${c.avg ? jp(Math.round(c.avg)) : "–"}</span></td>` : ""}
        <td class="r${mark(c.ex, "ex")}"><span class="num">${c.ex ? c.ex.toFixed(1) : "–"}</span></td>
        <td class="r${mark(c.enh, "enh")}"><span class="num">${c.enh ? "+" + c.enh.toFixed(0) : "–"}</span></td>
        <td class="r${mark(c.ref, "ref")}"><span class="num">${c.ref ? c.ref.toFixed(1) : "–"}</span></td>
        <td class="r${mark(c.red, "red")}"><span class="num">${c.red ? c.red.toFixed(1) : "–"}</span></td>
        <td class="dim hs">${c.d ? ago(c.d.updated_at) : "対象外"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="dim" style="margin-top:6px">上位10人の防衛編成から集計。装備強化・錬成は英雄装備1つあたりの平均、赤装備は1人あたりの個数です。英雄の表記：★＝星、盾/槍/弓＝兵種。英雄名が「英雄50031」のように番号で出るときは<a href="#/heroes">英雄名の設定</a>で名前を付けられます。オレンジ色はその項目で一番高い王国です。</p>
    <h2>上位10人の防衛編成</h2>
    <div class="cmpgrid herogrid">${cols.map(c => `<section class="cmpcol">
      <h3><a href="#/state/${c.k}">#${c.k}</a></h3>
      ${!c.d ? `<p class="note">この王国の英雄データはまだありません🧊<br>どうしても見たい人は、管理人の${esc(ADMIN_NAME)}にこっそりお願いしてみてください。機嫌が良ければ、翌朝には届いているかも…🔥</p>`
        : c.players.map(p => `<article class="pcard">
          <div class="phead">${avatar(p.avatar_url, p.nick_name)}

    const n = Object.keys(notes).length, ne = Object.keys(evals).length;
    const msg = app.querySelector("#shareMsg");
    if (!n && !ne) { msg.textContent = "この端末にはまだメモも評価もありません。"; return; }
    const blob = await packNotes(notes, viewMigrate.pass, evals);
    const url = location.origin + location.pathname + "#/" + cands.join(",") + "&n=" + blob;
    try { await navigator.clipboard.writeText(url); msg.textContent = `メモ${n}件・評価${ne}王国分の共有リンクをコピーしました（${url.length}文字）。Discordに貼ってください。`; }
    catch { msg.innerHTML = `下のリンクをコピーしてください（メモ${n}件）<br><textarea readonly rows="3" style="width:100%;font-size:12px">${esc(url)}</textarea>`; }
    if (url.length > 1900) msg.textContent += " ※Discordの1メッセージの文字数上限（2000字）に近いので、貼れない場合はメモを分けてください。";
  };
  viewMigrate.drawn = true;
}

// ---------- 移民用の王国ページ ----------
async function viewMigrateState(kid) {
  viewMigrate.drawn = false;
  const [list, lang, meta, tg, enc, svsSum, d, svsList] = await Promise.all([load("states.json"), load("lang.json"), load("meta.json"),
    getJSON("transfer-groups.json"), load("migrants.enc.json"), load("svs/summary.json"), load(`states/${kid}.json`), load(`svs/${kid}.json`)]);
  await heroNamesReady;
  if (enc && !viewMigrate.secret) {
    let saved = null; try { saved = localStorage.getItem(MIG_PASS_KEY); } catch {}
    if (saved) { try { viewMigrate.secret = await decryptMigrants(enc, saved); viewMigrate.pass = saved; } catch {} }
  }
  const migr = viewMigrate.secret || null;
  const people = loadPeople(migr);
  const events = tg?.events || (tg?.event ? [{ id: "cur", label: "今回の移民", status: "公式", ...tg.event, groups: tg.groups }] : []);
  const ev = events.find(e => e.id === (viewMigrate.evId || tg?.default)) || events[0] || null;
  const groupOf = k => (ev?.groups || []).find(([a, b]) => k >= a && k <= b) || null;
  const base = list?.states?.find(x => String(x.kid) === String(kid)) || { kid: Number(kid) };
  const x = lang?.states?.[kid] || {}, sv = svsSum?.[kid];
  const r = { ...base, ...(d?.state || {}), jp: x.jp ?? null, dom: x.dom ?? null, top1: x.top1 ?? null, big: x.big ?? null,
    p10: x.p10 ?? null, p30: x.p30 ?? null, p100: x.p100 ?? null, t100: x.t100 ?? null,
    svsN: sv?.n || 0, svsW: sv?.w || 0, svsRate: sv?.n ? Math.round(sv.w / sv.n * 100) : null };
  r._power = totalPower(r);
  const evl = localEvals()[kid] || {}, E = evaluate(r, people, evl);
  const cands = (viewMigrate.lastCands || "").split(",").filter(Boolean);
  const inCand = cands.includes(String(kid));
  const back = "#/" + cands.join(",");
  const homeKids = migr?.people?.filter(p => p.kid).map(p => p.kid) || meta?.watch_states || [];
  const g = groupOf(Number(kid)), myG = homeKids.map(groupOf);
  const inGroup = g && myG.length && myG.every(m => m === g);
  const pp = boardRows(d?.boards, "personal_power"), tr = boardRows(d?.boards, "state_transfer"), lab = boardRows(d?.boards, "labyrinth"), al = boardRows(d?.boards, "alliance_power");
  const rk = v => v == null ? "–" : v === "圏外" ? "圏外" : `${v}位`;
  const transferTotal = Number(r.state_transfer_score) || 0;
  // 上位100人の同盟別の人数
  const byAl = new Map(); for (const p of pp) { const k = p.alliance_abbr || "（無所属）"; byAl.set(k, (byAl.get(k) || 0) + 1); }
  const alDist = [...byAl.entries()].sort((a, b) => b[1] - a[1]);
  const alInfo = new Map(al.map(a => [a.abbr, a]));
  const line = n => pp.length >= n ? jp(pp[n - 1].score) : "–";

  app.innerHTML = `
    <p class="sub"><a href="${back}">← 移民検討に戻る</a></p>
    <div class="mshead"><h1 class="num">#${esc(kid)}</h1><span class="score big ${scoreClass(E.total)}">${E.total ?? "–"}<small>点</small></span>
      <button type="button" class="star${inCand ? " on" : ""}" id="msStar" aria-label="候補">${inCand ? "★" : "☆"}</button></div>
    <div class="candstats">
      <span>${ev ? (inGroup ? `<b class="ok">${esc(ev.label)}の移民範囲内</b>（${g[0]}〜${g[1]}）` : `<b class="ng">${esc(ev.label)}の移民範囲外</b>`) : ""}</span>
      <span>日本語名 <b>${r.jp != null ? r.jp + "%" : "–"}</b></span><span>最大同盟の占有 <b>${r.top1 != null ? r.top1 + "%" : "–"}</b></span>
      <span>大同盟 <b>${r.big ?? "–"}</b></span><span>SvS <b>${r.svsN ? `${r.svsW}勝${r.svsN - r.svsW}敗` : "記録なし"}</b></span>
      <span>総戦力 <b>${jp(r._power)}</b></span><span>移民スコア <b>${jp(r.state_transfer_score)}</b></span>
      <span>人数 <b>${int(r.player_count)}</b></span><span>開設 <b>${r.age_days != null ? int(r.age_days) + "日" : "–"}</b></span>
    </div>
    <h2>評価</h2>
    <div class="evalbox">
      <label class="evst">状態<select class="evsel" data-k="${kid}" name="status_search_${kid}">${STATUSES.map(t => `<option ${(evl.status || "未確認") === t ? "selected" : ""}>${t}</option>`).join("")}</select></label>
      ${E.items.map(it => `<div class="evrow"><span class="evl" title="${esc(it.hint)}">${esc(it.label)}</span>
        ${it.auto ? `<span class="pts">${it.v == null ? `<span class="dim">–</span>` : "●".repeat(it.v) + `<span class="off">${"●".repeat(5 - it.v)}</span>`}</span><span class="dim evw">${esc(it.why || "")}</span>`
          : `<span class="stars" data-k="${kid}" data-c="${it.key}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-n="${n}" class="${it.v >= n ? "on" : ""}" aria-label="${n}">★</button>`).join("")}</span><span class="dim evw">${esc(it.hint)}</span>`}</div>`).join("")}
      <input type="text" class="evcomment" data-k="${kid}" name="comment_search_${kid}" ${SEARCH_ATTRS} maxlength="80" placeholder="ひとことメモ" value="${esc(evl.comment || "")}">
    </div>
    <div class="notes">${notesFor(kid, migr).map(n => `<a class="notebtn" href="${esc(n.url)}" target="_blank" rel="noopener noreferrer">📝 ${esc(n.label || noteLabel(n.url))}</a>`).join("")}
      <details class="noteedit"><summary>${safeUrl(localNotes()[kid]) ? "この端末のメモを変更" : "メモのリンクを追加"}</summary>
        <input type="url" class="noteurl" data-k="${kid}" name="note_url_${kid}" ${SEARCH_ATTRS} placeholder="https://discord.com/channels/..." value="${esc(localNotes()[kid] || "")}"></details></div>
    ${!d ? `<p class="note">この王国の詳細はまだ取得されていません。順次取得されます。</p>` : `
    <h2>メンバーが入ったら</h2>
    <div class="tablewrap"><table><thead><tr><th>メンバー</th><th class="r">戦力</th><th class="r">移民スコア</th><th class="r">地底探検</th><th class="r">スコア比</th></tr></thead><tbody>
      ${people.map(p => `<tr><td>${esc(p.name)}</td><td class="r">${rk(predictRank(pp, p.power))}</td><td class="r">${rk(predictRank(tr, p.transfer))}</td><td class="r">${rk(predictRank(lab, p.lab))}</td>
        <td class="r">${p.transfer && transferTotal ? (p.transfer / transferTotal * 100).toFixed(2) + "%" : "–"}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="dim">戦力のライン：1位 ${line(1)}・10位 ${line(10)}・30位 ${line(30)}・100位 ${line(100)}。移民スコアの100位ライン：${tr.length >= 100 ? jp(tr[99].score) : "–"}。</p>

    <h2>同盟の勢力図</h2>
    <p class="dim">個人戦力の上位100人が、どの同盟に何人いるか。1つの同盟に集中しているほど「型ができている」王国です。</p>
    <div class="aldist">${alDist.slice(0, 10).map(([abbr, n]) => { const a = alInfo.get(abbr);
      return `<div class="alrow"><span class="aln">[${esc(abbr)}] ${esc(a?.name || "")}</span><span class="albar"><i style="width:${n}%"></i></span><span class="num">${n}人</span>
        <span class="dim alx">${a ? `盟主 ${esc(a.leader_name || "–")}・${a.member_count ?? "–"}人・${jp(a.score)}` : ""}</span></div>`; }).join("")}</div>

    <h2>上位20人</h2>
    <div class="tablewrap"><table><thead><tr><th>順位</th><th>領主</th><th>同盟</th><th class="r">戦力</th></tr></thead><tbody>
      ${pp.slice(0, 20).map((p, i) => `<tr><td class="num">${p.rank ?? i + 1}</td><td>${esc(p.nick_name)}</td><td>${p.alliance_abbr ? `[${esc(p.alliance_abbr)}]` : "–"}</td><td class="r num">${jp(p.score)}</td></tr>`).join("")}
    </tbody></table></div>`}
    <section id="msSvs"></section>
    <p><a href="./#/state/${esc(kid)}" target="_blank" rel="noopener">この王国の通常のページを開く →</a>　<a href="./#/compare/${[homeKids[0], kid].filter(Boolean).join(",")}" target="_blank" rel="noopener">自王国と地底探検・英雄を比較 →</a></p>`;
  renderSvs(app.querySelector("#msSvs"), svsList);

  const rerender = () => viewMigrateState(kid);
  app.querySelector("#msStar").onclick = () => {
    const next = inCand ? cands.filter(c => c !== String(kid)) : [...cands, String(kid)];
    viewMigrate.lastCands = next.join(","); rerender();
  };
  app.querySelector(".evsel").onchange = e => { saveEval(String(kid), { status: e.target.value }); rerender(); };
  app.querySelectorAll(".stars button").forEach(btn => btn.onclick = () => { const c = btn.parentElement.dataset.c, n = Number(btn.dataset.n); const cur = localEvals()[kid]?.[c]; saveEval(String(kid), { [c]: cur === n ? null : n }); rerender(); });
  app.querySelector(".evcomment").onchange = e => saveEval(String(kid), { comment: e.target.value.trim() || null });
  app.querySelector(".noteurl").onchange = e => { const v = e.target.value.trim(); if (v && !safeUrl(v)) { e.target.setCustomValidity("https:// から始まるURLを貼ってください"); e.target.reportValidity(); return; } e.target.setCustomValidity(""); saveLocalNote(String(kid), v || null); rerender(); };
}

// ---------- ルーティング ----------
async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  if (MODE === "migrate") { // 移民検討ページ：ほかの画面には行かない
    const blob = takeNoteBlob();
    if (blob) viewMigrate.pendingNotes = blob;
    if (!viewMigrate.drawn) window.scrollTo(0, 0);
    if (parts[0] === "s" && /^\d+$/.test(parts[1] || "")) { await viewMigrateState(parts[1]); document.title = `#${parts[1]} | 移民検討`; return; }
    const p0 = (parts[0] === "migrate" ? parts[1] : parts[0]) || "";
    viewMigrate.lastCands = p0.split(/[&?]/)[0];
    await viewMigrate(viewMigrate.lastCands);
    document.title = "移民検討";
    return;
  }
  window.scrollTo(0, 0);
  if (parts[0] === "state" && parts[1]) await viewState(parts[1]);
  else if (parts[0] === "alliance" && parts[1] && parts[2]) await viewAlliance(parts[1], parts[2]);
  else if (parts[0] === "compare") await viewCompare(parts[1], parts[2]);
  else if (parts[0] === "heroes") await viewHeroNames();
  else await viewStates();
  const t = { state: `王国 #${parts[1]}`, alliance: `[${parts[2]}] 王国 #${parts[1]}`, compare: "王国比較", heroes: "英雄名の設定", migrate: "移民検討" }[parts[0]];
  document.title = (t ? t + " | " : "") + "WoS 王国データ";
}
if (MODE === "migrate") {
  document.querySelector("header.site .brand").textContent = "🧭 移民検討";
  document.querySelector("header.site .brand").removeAttribute("href");
  document.querySelector("nav.topnav")?.remove();
  document.querySelector("nav.tabbar")?.remove();
  document.body.classList.add("mode-migrate");
}
load("meta.json").then(m => {
  if (m?.updated_at) document.getElementById("updated").textContent = "最終更新 " + ago(m.updated_at);
  const a = m?.watch_alliances?.[0];
  if (a) document.querySelectorAll("a.mine").forEach(el => { el.href = `#/alliance/${a.kid}/${encodeURIComponent(a.tag)}`; el.hidden = false; el.lastChild.textContent = `[${a.tag}]`; });
});
function markTab() {
  const h = location.hash;
  const tab = h.startsWith("#/compare") ? "compare" : h.startsWith("#/migrate") ? "migrate" : h.startsWith("#/alliance") ? "mine" : (h === "" || h === "#/" || h.startsWith("#/state")) ? "list" : "";
  document.querySelectorAll("[data-tab]").forEach(el => el.setAttribute("aria-current", el.dataset.tab === tab ? "page" : "false"));
}
addEventListener("hashchange", markTab); markTab();
addEventListener("hashchange", route);
route();
</script>
</body>
