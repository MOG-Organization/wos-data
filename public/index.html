<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WoS 王国データ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EAF0F5;
    --surface: #F7FAFC;
    --ink: #16273A;
    --steel: #586D82;
    --rime: #C9D5E1;
    --ember: #D47A22;
    --ember-soft: #F3D2AE;
    --link: #1F5E99;
    color-scheme: light;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0E1A26; --surface: #152536; --ink: #E2EBF3; --steel: #91A5B9;
      --rime: #263A50; --ember: #F09A46; --ember-soft: #5A3A1C; --link: #8CC2F2;
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
    font-size: 15px; line-height: 1.6;
  }
  a { color: var(--link); text-decoration: none; }
  a:hover { text-decoration: underline; }
  a:focus-visible, button:focus-visible, input:focus-visible, th:focus-visible {
    outline: 2px solid var(--ember); outline-offset: 2px; border-radius: 3px;
  }
  .num { font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-variant-numeric: tabular-nums; letter-spacing: .01em; }

  header.site {
    border-bottom: 1px solid var(--rime); background: var(--surface);
  }
  header.site .in { max-width: 1080px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  header.site .brand { font-weight: 700; font-size: 17px; color: var(--ink); }
  header.site nav { display: flex; gap: 16px; font-size: 14px; }
  header.site .updated { margin-left: auto; font-size: 12px; color: var(--steel); }

  main { max-width: 1080px; margin: 0 auto; padding: 24px 20px 64px; }
  h1 { font-size: 22px; margin: 0 0 4px; line-height: 1.35; }
  h2 { font-size: 17px; margin: 32px 0 10px; }
  .sub { color: var(--steel); font-size: 13px; margin: 0 0 18px; }

  .hero-num {
    font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-weight: 700;
    font-size: clamp(64px, 14vw, 120px); line-height: .9; letter-spacing: -.01em;
    color: var(--ink); margin: 0;
  }
  .hero-num small { font-family: "Zen Kaku Gothic New", sans-serif; font-size: 18px; font-weight: 500; color: var(--steel); margin-right: 8px; letter-spacing: 0; }

  .stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0; background: var(--surface); border: 1px solid var(--rime); border-radius: 6px; overflow: hidden; margin: 18px 0 8px; }
  .stats div { padding: 10px 14px; box-shadow: 1px 0 0 var(--rime), 0 1px 0 var(--rime); }
  .stats dt { font-size: 12px; color: var(--steel); }
  .stats dd { margin: 0; font-size: 22px; font-weight: 700; }

  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  input[type=search] {
    font: inherit; padding: 8px 12px; border: 1px solid var(--rime); border-radius: 6px;
    background: var(--surface); color: var(--ink); width: min(280px, 100%);
  }
  .count { font-size: 13px; color: var(--steel); }
  button.more {
    font: inherit; font-size: 14px; padding: 8px 18px; border: 1px solid var(--rime); border-radius: 6px;
    background: var(--surface); color: var(--ink); cursor: pointer; margin-top: 12px;
  }

  .tablewrap { overflow-x: auto; border: 1px solid var(--rime); border-radius: 6px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 12px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--rime); }
  tbody tr:last-child td { border-bottom: 0; }
  th { font-size: 12px; font-weight: 500; color: var(--steel); background: var(--bg); position: sticky; top: 0; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable[aria-sort=descending]::after { content: " ▼"; font-size: 9px; }
  th.sortable[aria-sort=ascending]::after { content: " ▲"; font-size: 9px; }
  td.r, th.r { text-align: right; }
  td .num { font-size: 16px; }
  tbody tr:hover { background: color-mix(in srgb, var(--ember-soft) 25%, transparent); }

  /* 戦力の「熱」バー：その表の最大値に対する割合 */
  .heat { display: grid; grid-template-columns: 1fr 5.2em; align-items: center; gap: 10px; min-width: 170px; }
  .heat i { display: block; height: 6px; border-radius: 3px; background: var(--rime); overflow: hidden; }
  .heat > span { text-align: right; }
  .heat i b { display: block; height: 100%; background: linear-gradient(90deg, var(--ember-soft), var(--ember)); }

  .rankpill { display: inline-block; min-width: 30px; text-align: center; font-size: 12px; padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rime); }
  .rankpill.r5 { border-color: var(--ember); color: var(--ember); font-weight: 700; }
  .rankpill.r4 { border-color: var(--steel); }

  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px; }
  .note { font-size: 13px; color: var(--steel); padding: 14px 16px; border: 1px dashed var(--rime); border-radius: 6px; background: var(--surface); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
  .dim { color: var(--steel); font-size: 12px; }
  p.dim { margin: -4px 0 12px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
  .seg button { font: inherit; font-size: 13px; padding: 5px 12px; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); color: var(--ink); cursor: pointer; }
  .seg button[aria-selected=true] { border-color: var(--ember); color: var(--ember); font-weight: 700; }
  td.win .num, td.win { color: var(--ember); font-weight: 700; }
  .chips .x { font: inherit; font-size: 13px; border: 0; background: none; color: var(--steel); cursor: pointer; margin-left: -6px; padding: 4px 6px; }
  .cmpgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .cmpcol { background: var(--surface); border: 1px solid var(--rime); border-radius: 6px; padding: 10px 12px; }
  .cmpcol h3 { margin: 0 0 6px; font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-size: 24px; }
  ol.top10 { list-style: none; margin: 0; padding: 0; }
  ol.top10 li { display: grid; grid-template-columns: 1.6em 1fr auto; gap: 8px; align-items: baseline; padding: 4px 0; border-bottom: 1px solid var(--rime); font-size: 14px; }
  ol.top10 li:last-child { border-bottom: 0; }
  ol.top10 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  ol.top10 .sc { font-size: 16px; }
  ol.top10 .rk { color: var(--steel); }
  .res.win { color: var(--ember); font-weight: 700; }
  .res.lose { color: var(--steel); }
  .days { letter-spacing: .15em; font-weight: 700; white-space: nowrap; }
  .days .day.w { color: var(--ember); }
  .days .day.l { color: var(--steel); }
  .modeseg a { flex: 0 0 auto; padding: 6px 14px; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); font-size: 14px; color: var(--ink); text-decoration: none; }
  .modeseg a[aria-selected=true] { border-color: var(--ember); color: var(--ember); font-weight: 700; }
  .av, .hicon { position: relative; display: inline-grid; place-items: center; flex: 0 0 auto; overflow: hidden; background: var(--rime); color: var(--steel); font-weight: 700; }
  .av { width: 40px; height: 40px; border-radius: 50%; font-size: 16px; }
  .hicon { width: 30px; height: 30px; border-radius: 6px; font-size: 12px; }
  .av img, .hicon img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .herogrid { grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .pcard { border-top: 1px solid var(--rime); padding: 10px 0; }
  .pcard:first-of-type { border-top: 0; }
  .phead { display: flex; gap: 10px; align-items: center; }
  .phead > div { min-width: 0; }
  .phead b { font-size: 14px; }
  .phead .dim { font-size: 11px; }
  .heroes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-top: 8px; }
  .hero { display: flex; gap: 5px; align-items: center; background: var(--bg); border-radius: 6px; padding: 5px 4px; min-width: 0; }
  .hmeta { display: flex; flex-direction: column; min-width: 0; font-size: 11px; line-height: 1.35; }
  .hmeta b { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hmeta span { color: var(--steel); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hmeta .num { font-size: 12px; color: var(--ink); }
  details { margin-top: 6px; font-size: 12px; }
  details summary { cursor: pointer; color: var(--link); }
  .gd { padding: 6px 0; border-bottom: 1px dashed var(--rime); }
  .gd .dim { margin-left: 6px; }
  .gd .g { display: inline-block; margin: 3px 6px 0 0; padding: 1px 6px; border: 1px solid var(--rime); border-radius: 4px; }
  .gd .g.red { border-color: var(--ember); color: var(--ember); }
  .gd small { margin-left: 3px; color: var(--steel); }
  .picked { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 0 10px; }
  .kchip { display: inline-flex; align-items: center; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); }
  .kchip a { padding: 6px 4px 6px 14px; font-family: "Saira Condensed", "Arial Narrow", sans-serif; font-size: 17px; }
  .kchip .x { font: inherit; border: 0; background: none; color: var(--steel); cursor: pointer; padding: 6px 12px 6px 8px; font-size: 16px; }
  .addk { font: inherit; font-size: 14px; padding: 7px 14px; border: 1px dashed var(--ember); border-radius: 999px; background: none; color: var(--ember); cursor: pointer; }
  .picker { border: 1px solid var(--rime); border-radius: 8px; background: var(--surface); padding: 12px; margin: 0 0 14px; }
  .pkq { margin-bottom: 10px; }
  .pkrow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .pkb { font: inherit; display: inline-flex; gap: 6px; align-items: baseline; padding: 6px 12px; border: 1px solid var(--rime); border-radius: 8px; background: var(--bg); color: var(--ink); cursor: pointer; }
  .pkb.on, .pkr.on { border-color: var(--ember); }
  .pkb b { font-size: 16px; }
  .tag { font-size: 10px; padding: 0 5px; border-radius: 3px; background: var(--ember-soft); color: var(--ink); }
  .pkl { display: grid; gap: 4px; max-height: 320px; overflow-y: auto; }
  .pkr { font: inherit; display: grid; grid-template-columns: 4.2em 1fr auto auto 1.6em; gap: 10px; align-items: center; text-align: left; padding: 8px 10px; border: 1px solid var(--rime); border-radius: 6px; background: var(--bg); color: var(--ink); cursor: pointer; }
  .pkr b { font-size: 16px; }
  .pkr .ck { color: var(--ember); font-weight: 700; text-align: center; }
  input.hn-in { font: inherit; font-size: 16px; padding: 4px 8px; border: 1px solid var(--rime); border-radius: 4px; background: var(--surface); color: var(--ink); width: 10em; }
  code { font-size: 12px; background: var(--bg); padding: 1px 4px; border-radius: 3px; }
  label.check { font-size: 14px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .jp { display: inline-block; min-width: 3.2em; text-align: right; }
  .jp.hi { color: var(--ember); font-weight: 700; }
  .chips a { padding: 4px 12px; border: 1px solid var(--rime); border-radius: 999px; background: var(--surface); font-size: 14px; }

  .tabbar { display: none; }
  header.site nav.topnav a[aria-current=page] { color: var(--ember); font-weight: 700; }
  input[type=search] { font-size: 16px; } /* iOS で入力時に拡大されないように */
  @media (max-width: 640px) {
    body { font-size: 14px; padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    header.site .in { padding: 10px 14px; gap: 10px; flex-wrap: nowrap; }
    header.site .brand { font-size: 16px; white-space: nowrap; }
    header.site nav.topnav { display: none; }
    .tools.addrow { flex-wrap: nowrap; }
    .tools.addrow input[type=search] { min-width: 0; }
    .tools.addrow button { flex: 0 0 auto; }
    header.site .updated { font-size: 11px; }
    main { padding: 16px 14px 32px; }
    h1 { font-size: 19px; }
    h2 { font-size: 16px; margin: 24px 0 8px; }
    .hs { display: none; }
    th, td { padding: 7px 8px; }
    td .num { font-size: 15px; }
    .heat { min-width: 0; grid-template-columns: 1fr; }
    .heat i { display: none; }
    .heat > span { text-align: right; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .stats dd { font-size: 19px; }
    .chips.scrollx, .seg { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; padding-bottom: 2px; }
    .chips.scrollx a, .seg button { flex: 0 0 auto; white-space: nowrap; }
    .seg button { padding: 8px 14px; font-size: 14px; }
    .tools input[type=search] { width: 100%; flex: 1 1 auto; }
    .grid2 { grid-template-columns: 1fr; gap: 0; }
    .cmpgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .cmpgrid.herogrid { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; gap: 10px; -webkit-overflow-scrolling: touch; }
    .cmpgrid.herogrid .cmpcol { flex: 0 0 92%; scroll-snap-align: start; }
    .herogrid .hicon { display: none; }
    .herogrid .hero { padding: 5px 6px; }
    .modeseg a { padding: 8px 14px; }
    .cmpcol { padding: 8px; }
    .cmpcol h3 { font-size: 20px; }
    ol.top10 li { grid-template-columns: 1.2em minmax(0, 1fr) auto; gap: 4px; font-size: 12px; padding: 5px 0; }
    ol.top10 .nm .dim { display: none; }
    ol.top10 .sc { font-size: 14px; }
    .tabbar {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
      background: var(--surface); border-top: 1px solid var(--rime);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .tabbar a[hidden] { display: none; }
    .days { letter-spacing: 0; }
    .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 9px; font-size: 11px; color: var(--steel); text-decoration: none; }
    .tabbar a span { font-size: 20px; line-height: 1; }
    .tabbar a[aria-current=page] { color: var(--ember); font-weight: 700; }
    footer { padding-bottom: 16px; }
  }
  footer { max-width: 1080px; margin: 0 auto; padding: 0 20px 40px; font-size: 12px; color: var(--steel); }
  @media (prefers-reduced-motion: no-preference) {
    .heat i b { transition: width .5s ease-out; }
  }
</style>
</head>
<body>
<header class="site">
  <div class="in">
    <a class="brand" href="#/">🧊 WoS 王国データ</a>
    <nav class="topnav"><a href="#/" data-tab="list">王国一覧</a><a href="#/compare" data-tab="compare">地底探検比較</a><a href="#/" data-tab="mine" class="mine" hidden>マイ同盟</a></nav>
    <span class="updated" id="updated"></span>
  </div>
</header>
<main id="app"><p class="sub">読み込み中…</p></main>
<nav class="tabbar" aria-label="メインメニュー">
  <a href="#/" data-tab="list"><span aria-hidden="true">🧊</span>王国一覧</a>
  <a href="#/compare" data-tab="compare"><span aria-hidden="true">⛏️</span>地底探検比較</a>
  <a href="#/" data-tab="mine" class="mine" hidden><span aria-hidden="true">🔥</span>マイ同盟</a>
</nav>
<footer>
  データ出典: Whiteout Stats API（最大1時間前のデータを毎日取得）。Whiteout Survival は Century Games Pte. Ltd. の商標です。本サイトはファン制作で、同社とは関係ありません。
</footer>

<script>
const app = document.getElementById("app");
const cache = new Map();

async function load(rel) {
  if (cache.has(rel)) return cache.get(rel);
  const p = fetch("data/" + rel, { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null);
  cache.set(rel, p);
  return p;
}
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const safeTag = tag => encodeURIComponent(tag).replace(/%/g, "_");

// 数値を「億・万」で表示
function jp(n) {
  if (n == null || n === "" || isNaN(n)) return "–";
  n = Number(n);
  const a = Math.abs(n);
  if (a >= 1e8) return Number((n / 1e8).toFixed(a >= 1e10 ? 0 : 2)).toLocaleString("ja-JP") + "億";
  if (a >= 1e4) return Number((n / 1e4).toFixed(a >= 1e6 ? 0 : 1)).toLocaleString("ja-JP") + "万";
  return n.toLocaleString("ja-JP");
}
const int = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("ja-JP");
function ago(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleString("ja-JP", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function heat(v, max) {
  const pct = max > 0 && v > 0 ? Math.max(2, Math.round(v / max * 100)) : 0;
  return `<span class="heat"><i><b style="width:${pct}%"></b></i><span class="num">${jp(v)}</span></span>`;
}
const JP_TH = 30;
// 総戦力：power が 0 / 未集計のときは領主戦力の合計（gov_power）を使う
const totalPower = s => Number(s?.power) || Number(s?.gov_power) || null;
// 地底探検（The Labyrinth）。エリア名はアルテマの地底探検ページの表記
const LABY = [
  ["labyrinth", "総合"], ["land_of_heroes", "英雄の地"], ["cave_of_monsters", "獣の洞窟"], ["charm_mine", "宝石鉱山"],
  ["research_center", "地下科学研究所"], ["gear_forge", "装備の鍛冶炉"], ["gaia_heart", "大地の心"],
];
function jpBadge(v) {
  if (v == null) return "–";
  return `<span class="num jp ${v >= JP_TH ? "hi" : ""}">${v}%</span>`;
}
function rankPill(label, rank) {
  const t = label || (rank ? "R" + rank : "");
  const cls = /5/.test(t) ? "r5" : /4/.test(t) ? "r4" : "";
  return t ? `<span class="rankpill ${cls}">${esc(t)}</span>` : "";
}
function firstArray(obj, keys) {
  if (Array.isArray(obj)) return obj;
  if (!obj || typeof obj !== "object") return [];
  for (const k of keys) if (Array.isArray(obj[k])) return obj[k];
  return [];
}
function boardRows(boards, key) {
  if (!boards) return [];
  if (Array.isArray(boards)) {
    const b = boards.find(x => [x.board, x.key, x.type, x.slug].includes(key));
    return b ? firstArray(b, ["rows", "entries", "items", "ranks"]) : [];
  }
  return firstArray(boards[key], ["rows", "entries", "items", "ranks"]);
}

// 並べ替えできる表
function sortableTable({ columns, rows, initialSort, pageSize = 100, filter }) {
  let sortKey = initialSort.key, dir = initialSort.dir, shown = pageSize;
  const wrap = document.createElement("div");
  const render = () => {
    let list = filter ? rows.filter(filter()) : rows.slice();
    const col = columns.find(c => c.key === sortKey);
    const val = col?.sortVal || (r => r[sortKey]);
    list.sort((a, b) => {
      const x = val(a), y = val(b);
      if (x == null && y == null) return 0;
      if (x == null) return 1; if (y == null) return -1;
      return (typeof x === "string" ? x.localeCompare(y, "ja") : x - y) * (dir === "asc" ? 1 : -1);
    });
    const max = {};
    columns.filter(c => c.heat).forEach(c => max[c.key] = Math.max(0, ...list.map(r => Number(r[c.key]) || 0)));
    const head = columns.map(c => `<th class="${c.r ? "r " : ""}${c.hs ? "hs " : ""}${c.sort !== false ? "sortable" : ""}" ${c.sort !== false ? `tabindex="0" data-k="${c.key}"` : ""} ${c.key === sortKey ? `aria-sort="${dir === "asc" ? "ascending" : "descending"}"` : ""}>${c.label}</th>`).join("");
    const body = list.slice(0, shown).map((r, i) => `<tr>${columns.map(c => `<td class="${c.r ? "r" : ""}${c.hs ? " hs" : ""}">${c.cell(r, i, max[c.key])}</td>`).join("")}</tr>`).join("");
    wrap.innerHTML = `<p class="count">${int(list.length)}件</p><div class="tablewrap"><table><thead><tr>${head}</tr></thead><tbody>${body || `<tr><td colspan="${columns.length}">該当なし</td></tr>`}</tbody></table></div>${list.length > shown ? `<button class="more">さらに${Math.min(pageSize, list.length - shown)}件表示</button>` : ""}`;
    wrap.querySelectorAll("th.sortable").forEach(th => {
      const go = () => { const k = th.dataset.k; dir = (k === sortKey && dir === "desc") ? "asc" : "desc"; sortKey = k; render(); };
      th.onclick = go; th.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    });
    const more = wrap.querySelector("button.more");
    if (more) more.onclick = () => { shown += pageSize; render(); };
  };
  wrap.rerender = () => { shown = pageSize; render(); };
  render();
  return wrap;
}

// SvS 履歴（準備期間の点数）
function svsResult(e) {
  if (e.bye) return { text: "対戦なし", cls: "" };
  if (!e.final) return { text: "進行中", cls: "dim" };
  if (e.score > e.opponent_score) return { text: "勝ち", cls: "win" };
  if (e.score < e.opponent_score) return { text: "負け", cls: "lose" };
  return { text: "引き分け", cls: "" };
}
function svsDays(e) {
  return (e.days || []).map(d => {
    const done = /ended/i.test(d.status || "");
    const mark = !done ? "・" : d.own > d.opp ? "○" : d.own < d.opp ? "×" : "△";
    return `<span class="day ${done ? (d.own > d.opp ? "w" : "l") : ""}" title="${d.day}日目 ${esc(d.status)}：${int(d.own)} 対 ${int(d.opp)}">${mark}</span>`;
  }).join("");
}
function renderSvs(el, list) {
  if (!list?.length) {
    el.innerHTML = `<h2>SvS履歴（準備期間）</h2><p class="note">SvSの記録はまだありません。Frostyキーで運用している場合、SvS期間中に自動で記録されます。</p>`;
    return;
  }
  const fin = list.filter(e => e.final && !e.bye);
  const w = fin.filter(e => e.score > e.opponent_score).length;
  el.innerHTML = `<h2>SvS履歴（準備期間）</h2>
    <p class="sub">記録 ${list.length}シーズン　確定分 ${w}勝 ${fin.length - w}敗。準備期間（1〜5日目）の点数での勝敗で、城の攻防戦の結果ではありません。</p>`;
  el.append(sortableTable({
    rows: list, initialSort: { key: "season", dir: "desc" }, pageSize: 10,
    columns: [
      { key: "season", label: "シーズン", cell: r => `<span class="num">S${r.season}</span>` },
      { key: "opponent", label: "対戦相手", cell: r => r.opponent ? `<a href="#/state/${r.opponent}"><span class="num">#${r.opponent}</span></a>` : "–" },
      { key: "score", label: "自王国", r: true, cell: r => `<span class="num">${jp(r.score)}</span>` },
      { key: "opponent_score", label: "相手", r: true, cell: r => `<span class="num">${jp(r.opponent_score)}</span>` },
      { key: "_res", label: "結果", sort: false, cell: r => { const x = svsResult(r); return `<span class="res ${x.cls}">${x.text}</span>`; } },
      { key: "_days", label: "日別", sort: false, cell: r => `<span class="days">${svsDays(r)}</span>` },
    ],
  }));
}

const MAX_COMPARE = 6;

// エリアのスコアは「基準値 + (ステージ-1)×10 + 小ステージ」の形（例：10495 = 50-5）。
// 実データの score と score_label の対応から割り出した式で、平均値をステージ表記に戻すのに使う
function stageLabel(score) {
  if (!score) return "–";
  const n = Math.round(score) % 10000;
  if (n <= 0) return "–";
  const stage = Math.ceil(n / 10);
  return `${stage}-${n - (stage - 1) * 10}`;
}

async function setupPicker(kids, setKids, mode) {
  const openBtn = app.querySelector("#openPick"), panel = app.querySelector("#picker");

  for (const k of meta?.watch_states || []) {
    addQ(k, "自王国");
    const last = (await load(`svs/${k}.json`) || []).find(e => e.opponent);
    if (last) addQ(last.opponent, `S${last.season} 相手`);

  const listEl = app.querySelector("#pkList"), q = app.querySelector("#pkSearch"), jpBox = app.querySelector("#pkJp");
  const drawList = () => {
    PICK.q = q.value.trim(); PICK.jp = jpBox.checked;

    rows.sort((a, b) => PICK.q ? a.kid - b.kid : (totalPower(b) || 0) - (totalPower(a) || 0));
    listEl.innerHTML = rows.length ? rows.slice(0, 30).map(s => `<button type="button" class="pkr${kids.includes(String(s.kid)) ? " on" : ""}" data-k="${s.kid}">
        <b class="num">#${s.kid}</b><span class="num">${jp(totalPower(s))}</span><span class="dim">${s.jp != null ? `日本語${s.jp}%` : ""}</span>${heroSet.has(String(s.kid)) ? `<span class="tag">英雄</span>` : "<span></span>"}<span class="ck">${kids.includes(String(s.kid)) ? "✓" : "＋"}</span></button>`).join("")
      + (rows.length > 30 ? `<p class="dim">ほか${rows.length - 30}件。番号を続けて入力すると絞り込めます。</p>` : "")
      : `<p class="dim">該当する王国がありません。</p>`;
    listEl.querySelectorAll(".pkr").forEach(b => b.onclick = () => toggle(b.dataset.k));
  };
  q.oninput = drawList; jpBox.onchange = drawList;

      ${kids.length < MAX_COMPARE ? `<button type="button" class="addk" id="openPick" aria-expanded="${PICK.open}">＋ 王国を追加</button>` : `<span class="dim">上限の${MAX_COMPARE}王国です</span>`}</div>
    <div class="picker" id="picker" ${PICK.open && kids.length < MAX_COMPARE ? "" : "hidden"}>
      <div id="pkQuick" class="pkq"></div>
      <div class="tools"><input type="search" id="pkSearch" name="kingdom_search" placeholder="王国を検索（例：3345）" inputmode="numeric" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="search" aria-label="王国を検索" value="${esc(PICK.q)}">
        <label class="check"><input type="checkbox" id="pkJp" ${PICK.jp ? "checked" : ""}> 日本人が多い王国</label></div>
      <div id="pkList" class="pkl"></div>
    </div>
    <div id="cmp"></div>`;
  app.querySelectorAll(".kchip .x").forEach(b => b.onclick = () => setKids(kids.filter(k => k !== b.dataset.k)));
  setupPicker(kids, setKids, mode);

  const box = app.querySelector("#cmp");
  if (!kids.length) { box.innerHTML = `<p class="note">比較したい王国番号を2つ以上追加してください。</p>`; return; }
  if (mode === "hero") { await heroNamesReady; renderHeroCompare(box, kids, heroData); return; }

  const draw = () => {
    const isTotal = area === "labyrinth";
    const fmt = r => isTotal ? int(r.score) : esc(r.score_label ?? stageLabel(r.score));
    const cols = kids.map((k, i) => {
      const d = details[i];
      const rows = d ? boardRows(d.boards, area).slice(0, 10) : [];
      const scores = rows.map(r => Number(r.score) || 0);
      const avg = scores.length ? scores.reduce((a, b) => a + b, 0) / scores.length : 0;
      return { k, d, rows, top: scores[0] || 0, tenth: scores.length >= 10 ? scores[9] : 0, avg, total: d?.state?.labyrinth,
        topL: rows[0]?.score_label, tenthL: rows.length >= 10 ? rows[9]?.score_label : null };
    });
    const best = key => Math.max(0, ...cols.map(c => c[key] || 0));
    const mark = (v, key) => v && v === best(key) ? " win" : "";
    const show = v => !v ? "–" : isTotal ? int(Math.round(v)) : stageLabel(v);
    box.innerHTML = `
      <div class="seg" role="tablist">${LABY.map(([k, n]) => `<button role="tab" aria-selected="${k === area}" data-k="${k}">${n}</button>`).join("")}</div>
      <h2>まとめ（${LABY.find(x => x[0] === area)[1]}）</h2>
      <div class="tablewrap"><table>
        <thead><tr><th>王国</th><th class="r">1位</th><th class="r">10位</th><th class="r">上位10平均</th>${isTotal ? `<th class="r">王国合計</th>` : ""}<th class="hs">更新</th></tr></thead>
        <tbody>${cols.map(c => `<tr>
          <td><a href="#/state/${c.k}"><span class="num">#${c.k}</span></a></td>
          <td class="r${mark(c.top, "top")}"><span class="num">${isTotal ? show(c.top) : esc(c.topL ?? show(c.top))}</span></td>
          <td class="r${mark(c.tenth, "tenth")}"><span class="num">${isTotal ? show(c.tenth) : esc(c.tenthL ?? show(c.tenth))}</span></td>
          <td class="r${mark(c.avg, "avg")}"><span class="num">${isTotal ? show(c.avg) : "≈ " + show(c.avg)}</span></td>
          ${isTotal ? `<td class="r${mark(c.total, "total")}"><span class="num">${c.total ? int(c.total) : "–"}</span></td>` : ""}
          <td class="dim hs">${c.d ? ago(c.d.updated_at) : "未取得"}</td></tr>`).join("")}</tbody>
      </table></div>
      <p class="dim" style="margin-top:6px">10位＝上位10人に入るためのライン。オレンジ色はその項目で一番高い王国です。${isTotal ? "" : "エリアの平均はスコアから換算した目安のステージです。"}</p>
      <h2>上位10人</h2>
      <div class="cmpgrid">${cols.map(c => `<section class="cmpcol">
        <h3><a href="#/state/${c.k}">#${c.k}</a></h3>
        ${!c.d ? `<p class="note">この王国の詳細はまだ取得されていません。順次取得されます。</p>`
          : !c.rows.length ? `<p class="note">ランキングデータがありません。</p>`
          : `<ol class="top10">${c.rows.map((r, i) => `<li><span class="rk num">${r.rank ?? i + 1}</span><span class="nm">${esc(r.nick_name)}${r.alliance_abbr ? ` <span class="dim">[${esc(r.alliance_abbr)}]</span>` : ""}</span><span class="sc num">${fmt(r)}</span></li>`).join("")}</ol>`}
      </section>`).join("")}</div>`;
    box.querySelectorAll(".seg button").forEach(b => b.onclick = () => { area = b.dataset.k; draw(); });
  };
  draw();
}

// ---------- 英雄（防衛編成）の比較 ----------
const TROOP_JA = { Infantry: "盾兵", Lancer: "槍兵", Marksman: "弓兵" };
// 英雄名：hero-names.json（IDごとの日本語名・英語名ごとの日本語名）で置き換える
let HERO_NAMES = { by_id: {}, by_en: {} };
const heroNamesReady = fetch("hero-names.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(j => { if (j) HERO_NAMES = { by_id: j.by_id || {}, by_en: j.by_en || {} }; }).catch(() => {});
const isPlaceholderName = n => !n || /^hero\s*\d+$/i.test(String(n).trim());
function heroName(h) {
  const byId = HERO_NAMES.by_id[String(h.id)];
  if (byId) return byId;
  if (!isPlaceholderName(h.name)) return HERO_NAMES.by_en[h.name] || h.name;
  return `英雄${h.id ?? "?"}`;
}
const SLOT_JA = { helmet: "頭", gloves: "手", armor: "胴", boots: "足" };
const teamPower = p => (p.heroes || []).reduce((a, h) => a + (Number(h.power) || 0), 0);
function avatar(url, name, cls = "av") {
  const ch = esc(String(name || "?").trim().charAt(0) || "?");
  return `<span class="${cls}">${ch}${url ? `<img src="${esc(url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}</span>`;
}
function heroChip(h) {
  const troop = h.gear?.find(g => g.troop_label)?.troop_label;
  return `<div class="hero">
    ${avatar(h.icon, heroName(h), "hicon")}
    <div class="hmeta"><b title="ID ${esc(h.id)}">${esc(heroName(h))}</b>
      <span>Lv${esc(h.level ?? "–")}${h.stars != null ? ` ★${esc(h.stars)}` : ""}${troop ? ` ${esc((TROOP_JA[troop] || troop).charAt(0))}` : ""}</span>
      <span><span class="num">${jp(h.power)}</span>${h.exclusive_gear_level ? ` 専${esc(h.exclusive_gear_level)}` : ""}</span></div>
  </div>`;
}
function gearDetail(h) {
  const gear = (h.gear || []).map(g => `<span class="g${g.red ? " red" : ""}">${esc(SLOT_JA[g.slot] || g.slot)}+${esc(g.enhancement_level ?? 0)}${g.refine_level ? `<small>錬${esc(g.refine_level)}</small>` : ""}</span>`).join("");
  return `<div class="gd"><b>${esc(heroName(h))}</b>${h.exclusive_gear ? `<span class="dim">専用 ${esc(h.exclusive_gear.name ?? "")} Lv${esc(h.exclusive_gear.level ?? "")}</span>` : ""}<div>${gear || `<span class="dim">装備情報なし</span>`}</div></div>`;
}
function renderHeroCompare(box, kids, data) {
  const cols = kids.map((k, i) => {
    const d = data[i];
    const players = (d?.players || []).slice().sort((a, b) => (a.labyrinth_rank ?? 999) - (b.labyrinth_rank ?? 999));
    const tp = players.map(teamPower).filter(Boolean);
    const exs = players.flatMap(p => (p.heroes || []).map(h => Number(h.exclusive_gear_level) || 0));
    return { k, d, players, avg: tp.length ? tp.reduce((a, b) => a + b, 0) / tp.length : 0, max: Math.max(0, ...tp),
      ex: exs.length ? exs.reduce((a, b) => a + b, 0) / exs.length : 0 };
  });
  const best = key => Math.max(0, ...cols.map(c => c[key] || 0));
  const mark = (v, key) => v && v === best(key) ? " win" : "";
  box.innerHTML = `
    <h2>まとめ</h2>
    <div class="tablewrap"><table>
      <thead><tr><th>王国</th><th class="r">人数</th><th class="r">編成戦力の平均</th><th class="r">最強編成</th><th class="r">専用装備 平均Lv</th><th class="hs">更新</th></tr></thead>
      <tbody>${cols.map(c => `<tr>
        <td><a href="#/state/${c.k}"><span class="num">#${c.k}</span></a></td>
        <td class="r"><span class="num">${c.players.length || "–"}</span></td>
        <td class="r${mark(c.avg, "avg")}"><span class="num">${c.avg ? jp(Math.round(c.avg)) : "–"}</span></td>
        <td class="r${mark(c.max, "max")}"><span class="num">${c.max ? jp(c.max) : "–"}</span></td>
        <td class="r${mark(c.ex, "ex")}"><span class="num">${c.ex ? c.ex.toFixed(1) : "–"}</span></td>
        <td class="dim hs">${c.d ? ago(c.d.updated_at) : "対象外"}</td></tr>`).join("")}</tbody>
    </table></div>
    <p class="dim" style="margin-top:6px">編成戦力＝防衛編成の英雄の戦力の合計。英雄の表記：★＝星、盾/槍/弓＝兵種、専＝専用装備Lv。英雄名が「英雄50031」のように番号で出るときは<a href="#/heroes">英雄名の設定</a>で名前を付けられます。オレンジ色はその項目で一番高い王国です。</p>
    <h2>上位10人の防衛編成</h2>
    <div class="cmpgrid herogrid">${cols.map(c => `<section class="cmpcol">
      <h3><a href="#/state/${c.k}">#${c.k}</a></h3>
      ${!c.d ? `<p class="note">この王国は英雄情報の取得対象外です。config.json の hero_states に王国番号を追加すると、次回の更新から取得されます。</p>`
        : c.players.map(p => `<article class="pcard">
          <div class="phead">${avatar(p.avatar_url, p.nick_name)}
            <div><b>${esc(p.nick_name)}</b>${p.alliance?.abbr ? ` <span class="dim">[${esc(p.alliance.abbr)}]</span>` : ""}
              <div class="dim">地底探検 ${esc(p.labyrinth_rank ?? "–")}位（${int(p.labyrinth)}）・戦力 ${jp(p.power)}・編成 ${jp(teamPower(p))}</div></div></div>
          <div class="heroes">${(p.heroes || []).slice().sort((a, b) => (a.position ?? 9) - (b.position ?? 9)).map(heroChip).join("") || `<span class="dim">防衛編成の情報なし</span>`}</div>
          ${(p.heroes || []).length ? `<details><summary>装備の詳細</summary>${p.heroes.map(gearDetail).join("")}</details>` : ""}
        </article>`).join("")}
    </section>`).join("")}</div>`;
}

// ---------- 英雄名の設定 ----------
async function viewHeroNames() {
  await heroNamesReady;
  const meta = await load("meta.json");
  const files = await Promise.all((meta?.hero_states || []).map(k => load(`heroes/${k}.json`)));
  const seen = new Map(); // id -> { api, icon, count }
  for (const f of files) for (const p of f?.players || []) for (const h of p.heroes || []) {
    const id = String(h.id); const e = seen.get(id) || { api: h.name, icon: h.icon, count: 0 };
    e.count++; seen.set(id, e);
  }
  const ids = [...seen.keys()].sort((a, b) => seen.get(b).count - seen.get(a).count);
  app.innerHTML = `
    <h1>英雄名の設定</h1>
    <p class="sub">APIが新しい英雄の名前を返さず「Hero 50031」のような番号になることがあります。下の欄に日本語名を入れ、「設定ファイル用にコピー」を押して、GitHubの <code>public/hero-names.json</code> の中身を置き換えると、全員の画面に反映されます。</p>
    ${ids.length ? `<div class="tablewrap"><table><thead><tr><th>アイコン</th><th>ID</th><th>APIの名前</th><th>表示する名前</th><th class="r">登場数</th></tr></thead><tbody>
      ${ids.map(id => { const e = seen.get(id); return `<tr><td>${avatar(e.icon, e.api, "hicon")}</td><td class="num">${id}</td><td>${esc(e.api ?? "–")}</td>
        <td><input type="text" class="hn-in" data-id="${id}" data-api="${esc(e.api ?? "")}" name="hero_label_${id}" ${SEARCH_ATTRS} value="${esc(HERO_NAMES.by_id[id] || (!isPlaceholderName(e.api) ? (HERO_NAMES.by_en[e.api] || "") : ""))}" placeholder="例：ナタリア"></td>
        <td class="r num">${e.count}</td></tr>`; }).join("")}
      </tbody></table></div>
      <p><button type="button" class="more" id="copyNames">設定ファイル用にコピー</button> <span class="dim" id="copyMsg"></span></p>
      <textarea id="namesOut" readonly rows="8" style="width:100%;font-family:monospace;font-size:12px" hidden></textarea>`
    : `<p class="note">英雄データがまだありません。英雄の取得対象の王国（config.json の hero_states）のデータが入ると、ここに一覧が出ます。</p>`}`;
  const btnCopy = app.querySelector("#copyNames");
  if (!btnCopy) return;
  btnCopy.onclick = async () => {
    const by_id = { ...HERO_NAMES.by_id };
    app.querySelectorAll(".hn-in").forEach(i => { const v = i.value.trim(); if (v) by_id[i.dataset.id] = v; else delete by_id[i.dataset.id]; });
    const json = JSON.stringify({ by_id, by_en: HERO_NAMES.by_en }, null, 2);
    const out = app.querySelector("#namesOut"); out.value = json; out.hidden = false;
    try { await navigator.clipboard.writeText(json); app.querySelector("#copyMsg").textContent = "コピーしました。GitHubで貼り付けてください。"; }
    catch { out.select(); app.querySelector("#copyMsg").textContent = "下の内容を選択してコピーしてください。"; }
  };
}

// ---------- ルーティング ----------
async function route() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(decodeURIComponent);
  window.scrollTo(0, 0);
  if (parts[0] === "state" && parts[1]) await viewState(parts[1]);
  else if (parts[0] === "alliance" && parts[1] && parts[2]) await viewAlliance(parts[1], parts[2]);
  else if (parts[0] === "compare") await viewCompare(parts[1], parts[2]);
  else if (parts[0] === "heroes") await viewHeroNames();
  else await viewStates();
  const t = { state: `王国 #${parts[1]}`, alliance: `[${parts[2]}] 王国 #${parts[1]}`, compare: "王国比較", heroes: "英雄名の設定" }[parts[0]];
  document.title = (t ? t + " | " : "") + "WoS 王国データ";
}
load("meta.json").then(m => {
  if (m?.updated_at) document.getElementById("updated").textContent = "最終更新 " + ago(m.updated_at);
  const a = m?.watch_alliances?.[0];
  if (a) document.querySelectorAll("a.mine").forEach(el => { el.href = `#/alliance/${a.kid}/${encodeURIComponent(a.tag)}`; el.hidden = false; el.lastChild.textContent = `[${a.tag}]`; });
});
function markTab() {
  const h = location.hash;
  const tab = h.startsWith("#/compare") ? "compare" : h.startsWith("#/alliance") ? "mine" : (h === "" || h === "#/" || h.startsWith("#/state")) ? "list" : "";
  document.querySelectorAll("[data-tab]").forEach(el => el.setAttribute("aria-current", el.dataset.tab === tab ? "page" : "false"));
}
addEventListener("hashchange", markTab); markTab();
addEventListener("hashchange", route);
route();
</script>
